<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chore Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#120c24;--fg:#fff}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center;font-family:"Press Start 2P",monospace}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;box-shadow:0 0 0 4px #fff,0 0 0 8px #e53935,0 0 40px #000}
#touch{position:fixed;inset:auto 0 0 0;display:none;justify-content:space-between;padding:16px;pointer-events:none}
#touch .grp{display:flex;gap:14px}
#touch button{pointer-events:auto;width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:rgba(229,57,53,.55);color:#fff;font:16px "Press Start 2P",monospace;touch-action:none}
#touch button.j{background:rgba(255,193,7,.6);width:88px;height:88px}
@media (pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>
<canvas id="c" width="480" height="272"></canvas>
<div id="touch">
  <div class="grp"><button data-k="left">&#9664;</button><button data-k="right">&#9654;</button></div>
  <div class="grp"><button class="j" data-k="jump">JUMP</button></div>
</div>
<script>
"use strict";
// ================= SETUP =================
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=480,H=272,T=16,ROWS=17;
g.imageSmoothingEnabled=false;
function fit(){const s=Math.max(1,Math.min(innerWidth/W,innerHeight/H)*0.96);cv.style.width=(W*s|0)+'px';cv.style.height=(H*s|0)+'px';}
addEventListener('resize',fit);fit();
const FONT='"Press Start 2P",monospace';

// ================= INPUT =================
const keys={left:false,right:false,jump:false};let jumpPressed=false,anyPress=false;
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyZ:'jump'};
addEventListener('keydown',e=>{
  initAudio();
  const k=KM[e.code];
  if(k){if(k==='jump'&&!keys.jump)jumpPressed=true;keys[k]=true;e.preventDefault();}
  if(e.code==='Enter'||e.code==='Space')anyPress=true;
  if(e.code==='KeyM')toggleMute();
  if(e.code==='KeyP'||e.code==='Escape'){if(state==='play')state='pause';else if(state==='pause')state='play';}
});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=false;});
document.querySelectorAll('#touch button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();if(k==='jump'){jumpPressed=true;anyPress=true;}keys[k]=true;});
  const up=e=>{keys[k]=false;};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
});
document.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('#touch'))return;initAudio();anyPress=true;});
// Browsers keep audio muted until the player interacts, so the title screen asks for one click/key first
const soundReady=()=>AC&&AC.state==='running';
let soundGate=true;
// Try to start the title music the moment the page opens. Browsers only allow this if the player has
// already interacted with the site (or allowed autoplay); otherwise it starts on the very first click/tap/key.
addEventListener('load',()=>{try{initAudio();}catch(e){}});
['mousedown','touchend','click','keyup'].forEach(ev=>addEventListener(ev,()=>initAudio(),{passive:true}));

// ================= AUDIO =================
let AC=null,master=null,musicGain=null,sfxGain=null,muted=false,noiseBuf=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);
  musicGain=AC.createGain();musicGain.gain.value=0.38;musicGain.connect(master);
  sfxGain=AC.createGain();sfxGain.gain.value=0.8;sfxGain.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  setInterval(scheduler,25);
}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:0.5;}
const mtof=n=>440*Math.pow(2,(n-69)/12);
function tone(f,dur,type='square',vol=0.2,slide=null,t=null,dest=null){
  if(!AC)return;t=t??AC.currentTime;
  const o=AC.createOscillator(),ga=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  ga.gain.setValueAtTime(vol,t);ga.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(ga);ga.connect(dest||sfxGain);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,vol,hp=1000,t=null,dest=null){
  if(!AC)return;t=t??AC.currentTime;
  const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
  const ga=AC.createGain();ga.gain.setValueAtTime(vol,t);ga.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(ga);ga.connect(dest||sfxGain);s.start(t);s.stop(t+dur+0.02);
}
// kazoo lead: buzzy saw through a bandpass with wobbly vibrato
// soft lead for background music: mellow square+triangle through a lowpass, gentle vibrato
function softLead(f,dur,t,vol=0.06){
  const o=AC.createOscillator(),o2=AC.createOscillator(),lp=AC.createBiquadFilter(),ga=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();
  o.type='triangle';o2.type='square';o.frequency.value=f;o2.frequency.value=f*1.003;
  lfo.frequency.value=5;lg.gain.value=f*0.004;lfo.connect(lg);lg.connect(o.frequency);
  lp.type='lowpass';lp.frequency.value=1600;lp.Q.value=0.5;
  const g2=AC.createGain();g2.gain.value=0.25;o2.connect(g2);g2.connect(lp);o.connect(lp);
  ga.gain.setValueAtTime(0,t);ga.gain.linearRampToValueAtTime(vol,t+0.015);ga.gain.exponentialRampToValueAtTime(vol*0.5,t+dur*0.6);ga.gain.linearRampToValueAtTime(0,t+dur);
  lp.connect(ga);ga.connect(musicGain);[o,o2,lfo].forEach(x=>{x.start(t);x.stop(t+dur+0.05);});
}
function kazoo(f,dur,t,vol=0.13){
  const o=AC.createOscillator(),o2=AC.createOscillator(),bp=AC.createBiquadFilter(),ga=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();
  o.type='sawtooth';o2.type='square';o.frequency.value=f;o2.frequency.value=f*1.005;
  lfo.frequency.value=6.5;lg.gain.value=f*0.018;lfo.connect(lg);lg.connect(o.frequency);lg.connect(o2.frequency);
  bp.type='bandpass';bp.frequency.value=1400;bp.Q.value=1.6;
  ga.gain.setValueAtTime(0,t);ga.gain.linearRampToValueAtTime(vol,t+0.02);ga.gain.setValueAtTime(vol,t+dur*0.7);ga.gain.linearRampToValueAtTime(0,t+dur);
  // little "scoop" up into the note — very silly
  o.frequency.setValueAtTime(f*0.94,t);o.frequency.linearRampToValueAtTime(f,t+0.05);
  o.connect(bp);o2.connect(bp);bp.connect(ga);ga.connect(musicGain);
  [o,o2,lfo].forEach(x=>{x.start(t);x.stop(t+dur+0.05);});
}
const SFX={
  jump(){tone(300,0.18,'sine',0.25,900);},                          // slide whistle up
  boing(){tone(180,0.3,'square',0.18,720);tone(360,0.3,'triangle',0.15,90);},
  collect(){const t=AC&&AC.currentTime;if(!AC)return;[0,4,7,12].forEach((n,i)=>tone(mtof(76+n),0.09,'square',0.12,null,t+i*0.05));},
  hurt(){tone(400,0.5,'sawtooth',0.18,80);noise(0.2,0.2,300);},
  fall(){tone(900,0.9,'sine',0.25,60);},                            // slide whistle down
  honk(){if(!AC)return;const t=AC.currentTime;[0,0.22].forEach(d=>{tone(330,0.16,'sawtooth',0.18,null,t+d);tone(415,0.16,'sawtooth',0.14,null,t+d);});},
  nope(){tone(160,0.15,'square',0.15);tone(120,0.2,'square',0.15,null,AC&&AC.currentTime+0.15);},
  win(){if(!AC)return;const t=AC.currentTime;[72,76,79,84,79,84].forEach((n,i)=>kazoo(mtof(n),i==5?0.6:0.14,t+i*0.13,0.2));},
  lose(){if(!AC)return;const t=AC.currentTime;[67,66,65].forEach((n,i)=>tone(mtof(n-12),0.4,'sawtooth',0.2,null,t+i*0.45));tone(mtof(52),1.3,'sawtooth',0.2,mtof(48),t+1.35);},
  fart(){if(!AC)return;tone(90,0.35,'sawtooth',0.25,55);noise(0.3,0.08,100);}
};
// ---- music sequencer ----
const _=null;
const SONG={
  lead:[72,_,76,79, 81,79,76,_, 77,_,74,77, 76,72,_,_,
        72,_,76,79, 84,_,83,81, 79,77,76,74, 72,_,67,_,
        69,_,72,69, 71,_,74,71, 72,_,76,72, 74,79,_,_,
        77,76,75,74, 73,72,71,_, 79,_,67,_, 72,_,_,_],
  roots:[48,53,48,55,57,55,53,55],
};
function stopMusic(){music.on=false;}
// ---- MIDI-rock instruments: overdriven rhythm guitar, lead guitar, picked bass, rock kit ----
let gtrBus=null,leadBus=null;
function distCurve(k){const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x));}return c;}
function makeAmp(drive,tone,vol){ // waveshaper "amp" + cabinet filtering
  const inp=AC.createGain(),ws=AC.createWaveShaper(),hp=AC.createBiquadFilter(),lp=AC.createBiquadFilter(),mid=AC.createBiquadFilter(),out=AC.createGain();
  ws.curve=distCurve(drive);ws.oversample='4x';hp.type='highpass';hp.frequency.value=90;lp.type='lowpass';lp.frequency.value=tone;
  mid.type='peaking';mid.frequency.value=800;mid.gain.value=4;out.gain.value=vol;
  inp.connect(ws);ws.connect(hp);hp.connect(mid);mid.connect(lp);lp.connect(out);out.connect(musicGain);return inp;
}
function gtrNote(freqs,dur,t,vol,mute){ // power chord: detuned saws into the amp
  if(!gtrBus)gtrBus=makeAmp(60,3200,0.12);
  const ga=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=mute?700:2600;
  ga.gain.setValueAtTime(vol,t);ga.gain.exponentialRampToValueAtTime(vol*(mute?0.05:0.5),t+dur);ga.gain.linearRampToValueAtTime(0,t+dur+0.03);
  freqs.forEach(fr=>{[0,-7].forEach(det=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=fr;o.detune.value=det;o.connect(f);o.start(t);o.stop(t+dur+0.05);});});
  f.connect(ga);ga.connect(gtrBus);
}
function leadGtr(fr,dur,t,vol=0.5){
  if(!leadBus)leadBus=makeAmp(25,3800,0.11);
  const o=AC.createOscillator(),o2=AC.createOscillator(),ga=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();
  o.type='sawtooth';o2.type='square';o.frequency.value=fr;o2.frequency.value=fr*2.002;
  lfo.frequency.value=5.5;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(fr*0.012,t+Math.min(dur,0.4));lfo.connect(lg);lg.connect(o.frequency);lg.connect(o2.frequency);
  const g2=AC.createGain();g2.gain.value=0.3;o2.connect(g2);g2.connect(ga);o.connect(ga);
  o.frequency.setValueAtTime(fr*0.97,t);o.frequency.linearRampToValueAtTime(fr,t+0.04); // pick bend
  ga.gain.setValueAtTime(0,t);ga.gain.linearRampToValueAtTime(vol,t+0.01);ga.gain.setValueAtTime(vol*0.8,t+dur*0.8);ga.gain.linearRampToValueAtTime(0,t+dur);
  ga.connect(leadBus);[o,o2,lfo].forEach(x=>{x.start(t);x.stop(t+dur+0.05);});
}
function bassNote(fr,dur,t){
  const o=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter(),ga=AC.createGain();
  o.type='sawtooth';o2.type='triangle';o.frequency.value=fr;o2.frequency.value=fr;f.type='lowpass';f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(250,t+dur);
  ga.gain.setValueAtTime(0.22,t);ga.gain.exponentialRampToValueAtTime(0.05,t+dur);ga.gain.linearRampToValueAtTime(0,t+dur+0.02);
  o.connect(f);o2.connect(f);f.connect(ga);ga.connect(musicGain);[o,o2].forEach(x=>{x.start(t);x.stop(t+dur+0.05);});
}
// ================= MULTI-STYLE MUSIC ENGINE =================
// Every level gets its own genre. Each style: bpm, spb (steps per beat), bar (steps per bar), bars (bars per loop), play(step,time,stepDur)
let revIn=null;
function reverb(){
  if(revIn)return revIn;
  const len=AC.sampleRate*2.4|0,ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);}
  const cv=AC.createConvolver();cv.buffer=ir;const wet=AC.createGain();wet.gain.value=0.45;cv.connect(wet);wet.connect(musicGain);return revIn=cv;
}
function out(vol,send){const ga=AC.createGain();ga.connect(musicGain);if(send){const s=AC.createGain();s.gain.value=send;ga.connect(s);s.connect(reverb());}return ga;}
function O(type,f,t,end,dest,gain=1){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);let n=o;if(gain!==1){const g2=AC.createGain();g2.gain.value=gain;o.connect(g2);n=g2;}n.connect(dest);o.start(t);o.stop(end);return o;}
function decayEnv(ga,t,vol,len,a=0.005){ga.gain.setValueAtTime(0,t);ga.gain.linearRampToValueAtTime(vol,t+a);ga.gain.exponentialRampToValueAtTime(0.0008,t+len);}
function holdEnv(ga,t,vol,dur,a=0.02,rel=0.08){ga.gain.setValueAtTime(0,t);ga.gain.linearRampToValueAtTime(vol,t+a);ga.gain.setValueAtTime(vol,t+Math.max(a,dur-rel));ga.gain.linearRampToValueAtTime(0,t+dur);}
// --- instruments ---
function piano(m,dur,t,vol=0.12,send=0.35){const f=mtof(m),ga=out(vol,send),len=Math.max(0.6,dur)+0.9;
  decayEnv(ga,t,vol,len,0.004);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(f*8,t);lp.frequency.exponentialRampToValueAtTime(f*2,t+len);lp.connect(ga);
  O('triangle',f,t,t+len,lp);O('sine',f*2,t,t+len,lp,0.35);O('sine',f*3.01,t,t+len,lp,0.08);O('sine',f*0.5,t,t+len,lp,m<55?0.25:0);}
function organ(m,dur,t,vol=0.04,send=0.6){const f=mtof(m),ga=out(1,send);holdEnv(ga,t,vol,dur,0.015,0.05);
  [[1,1],[2,0.75],[3,0.3],[4,0.45],[6,0.12],[8,0.22]].forEach(([h,w])=>{if(f*h<9000)O('sine',f*h,t,t+dur+0.05,ga,w);});}
function epiano(m,dur,t,vol=0.08,send=0.2){const f=mtof(m),ga=out(1,send);decayEnv(ga,t,vol,dur+0.5,0.005);
  const c=O('sine',f,t,t+dur+0.6,ga),mod=AC.createOscillator(),mg=AC.createGain();mod.frequency.value=f;mg.gain.setValueAtTime(f*1.8,t);mg.gain.exponentialRampToValueAtTime(f*0.1,t+0.5);
  mod.connect(mg);mg.connect(c.frequency);mod.start(t);mod.stop(t+dur+0.6);O('sine',f*4,t,t+0.15,ga,0.08);}
function sax(m,dur,t,vol=0.07,send=0.25){const f=mtof(m),ga=out(1,send);holdEnv(ga,t,vol,dur,0.03,0.06);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2000;lp.Q.value=1.5;const pk=AC.createBiquadFilter();pk.type='peaking';pk.frequency.value=1100;pk.gain.value=7;lp.connect(pk);pk.connect(ga);
  const o=O('sawtooth',f*0.96,t,t+dur+0.05,lp);o.frequency.linearRampToValueAtTime(f,t+0.05);
  const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=5.2;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*0.01,t+Math.min(dur,0.35));l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur+0.05);}
function popLead(m,dur,t,vol=0.045,send=0.25){const f=mtof(m),ga=out(1,send);holdEnv(ga,t,vol,dur,0.01,0.05);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3800;lp.connect(ga);O('square',f,t,t+dur+0.05,lp).detune.value=-7;O('square',f,t,t+dur+0.05,lp).detune.value=7;O('sine',f*2,t,t+dur+0.05,lp,0.3);}
function pluck(m,dur,t,vol=0.04,send=0.2,bright=3000){const f=mtof(m),ga=out(1,send);decayEnv(ga,t,vol,Math.min(0.5,dur+0.15),0.003);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(bright,t);lp.frequency.exponentialRampToValueAtTime(300,t+0.2);lp.connect(ga);O('sawtooth',f,t,t+0.6,lp);O('square',f*1.004,t,t+0.6,lp,0.5);}
function subBass(m,dur,t,vol=0.32){const f=mtof(m),ga=out(1,0);holdEnv(ga,t,vol,dur,0.005,0.08);const o=O('sine',f*1.5,t,t+dur+0.05,ga);o.frequency.exponentialRampToValueAtTime(f,t+0.04);O('triangle',f*2,t,t+dur+0.05,ga,0.15);}
function synthBass(m,dur,t,vol=0.16){const f=mtof(m),ga=out(1,0);holdEnv(ga,t,vol,dur,0.004,0.03);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(1400,t);lp.frequency.exponentialRampToValueAtTime(300,t+dur);lp.connect(ga);O('sawtooth',f,t,t+dur+0.05,lp);O('square',f/2,t,t+dur+0.05,lp,0.5);}
function acid(m,dur,t,cut,vol=0.1){const f=mtof(m),ga=out(1,0.08);holdEnv(ga,t,vol,dur,0.003,0.02);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.Q.value=13;
  lp.frequency.setValueAtTime(cut*3,t);lp.frequency.exponentialRampToValueAtTime(Math.max(120,cut*0.6),t+dur);lp.connect(ga);O('sawtooth',f,t,t+dur+0.05,lp);}
function flute(m,dur,t,vol=0.06){const f=mtof(m),ga=out(1,0.6);holdEnv(ga,t,vol,dur,0.09,0.15);
  const o=O('sine',f,t,t+dur+0.05,ga);O('triangle',f*2,t,t+dur+0.05,ga,0.08);
  const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=4.8;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*0.006,t+Math.min(dur,0.5));l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur+0.05);
  nz(Math.min(dur,0.25),0.008,'bandpass',f*2,t,2);}
function walkBass(m,dur,t,vol=0.3){const f=mtof(m),ga=out(1,0.05);decayEnv(ga,t,vol,dur+0.15,0.01);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;lp.connect(ga);O('triangle',f,t,t+dur+0.2,lp);O('sine',f*2,t,t+dur+0.2,lp,0.2);}
// --- drums ---
function nz(dur,vol,type,freq,t,q=1){const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const ga=AC.createGain();ga.gain.setValueAtTime(vol,t);ga.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f);f.connect(ga);ga.connect(musicGain);s.start(t,Math.random()*0.5);s.stop(t+dur+0.02);return f;}
const kick=(t,v=0.6)=>{tone(160,0.18,'sine',v,40,t,musicGain);nz(0.015,v*0.25,'highpass',2000,t);};
const kick808=(t)=>{tone(110,0.6,'sine',0.7,36,t,musicGain);};
const snare=(t,v=0.22)=>{nz(0.16,v,'highpass',1200,t);tone(220,0.08,'triangle',v,150,t,musicGain);};
const hat=(t,open,v=0.05)=>nz(open?0.18:0.035,v,'highpass',8000,t);
const clap=(t,v=0.16)=>{for(let k=0;k<3;k++)nz(0.03,v,'bandpass',1300,t+k*0.011,1.5);nz(0.14,v*0.7,'bandpass',1300,t+0.033,1.2);};
const ride=(t,v=0.035)=>{nz(0.45,v,'highpass',6500,t);tone(2900,0.35,'square',0.006,null,t,musicGain);};
const brush=(t,v=0.05)=>nz(0.12,v,'bandpass',3500,t,0.7);

function scheduler(){
  if(!AC||!music.on)return;
  if(music.next<AC.currentTime-0.2)music.next=AC.currentTime+0.02;
  while(music.next<AC.currentTime+0.15){
    let S,i;
    if(music.style==='mix'){ // WHOLE HOUSE: medley that channel-surfs through every level's genre, 4 bars each
      S=STYLES[MIX[music.seg]];i=(music.segStep+music.cycle*S.bar*4)%(S.bar*S.bars);
      if(music.segStep===0&&(music.seg||music.cycle)){scratch(music.next);crash(music.next);}
    }else{S=STYLES[music.style];i=music.step;}
    let bpm=S.bpm;if(state==='play'&&timeLeft<15)bpm*=1.08;
    let d=60/bpm/S.spb;if(S.rub)d*=S.rub(i);
    S.play(i,music.next,d);
    music.next+=d;music.step++;
    if(music.style==='mix'){music.segStep++;if(music.segStep>=S.bar*4){music.segStep=0;music.seg++;if(music.seg>=MIX.length){music.seg=0;music.cycle++;}}}
  }
}

  legos.forEach(l=>{if(ground[l.x]&&map[l.row][l.x]==='.')map[l.row][l.x]='x';});
  // pick items evenly
  const cand=spots.filter(s=>s.x>6&&s.x<cols-8).sort((a,b)=>a.x-b.x);
  const items=[],n=Math.min(L.count,cand.length);
  const used=new Set();
  for(let i=0;i<n;i++){let k=Math.round(i*(cand.length-1)/Math.max(1,n-1));while(used.has(k))k++;used.add(k);const s=cand[k];
    const kinds=["sock","dish","toy","leaf","trash","shirt","ornament"];
    items.push({x:s.x*T,y:s.row*T-1,w:16,h:16,kind:L.item==='mix'?kinds[i%7]:L.item,got:false,bob:rng()*6});}
  const enemies=[];
  eSpots.filter(s=>s.x>14&&s.x<cols-10).forEach(s=>{
    const type=L.enemies[ri(0,L.enemies.length-1)];
    const e={type,x:s.x*T,y:s.row*T+4,w:14,h:12,vx:-1,vy:0,alive:true,t:rng()*6,dead:0};
    if(type==='bee'||type==='bat'){e.y=(s.row-2)*T;e.by=e.y;e.vx=-1;}

  const drop={x:(cols-6)*T-4,y:(ROWS-dh)*T-24,w:28,h:24,kind:L.drop};
  return {L,idx,cols,map,ground,items,enemies,movers,drop,theme:THEMES[L.theme],total:items.length};
}

function updatePlayer(dt){

  if(!keys.jump&&P.vy<-160)P.vy=-160;

  P.x+=P.vx*dt;

  if(P.vx>0){const c=Math.floor((P.x+P.w)/T);for(let r=r0;r<=r1;r++)if(solid(c,r)){P.x=c*T-P.w;P.vx=0;break;}}

  const prevB=P.y+P.h;if(P.vy>0)P.lastVy=P.vy;P.y+=P.vy*dt;P.on=false;
  const c0=Math.floor(P.x/T),c1=Math.floor((P.x+P.w-0.01)/T);
  if(P.vy>=0){
    const r=Math.floor((P.y+P.h)/T);

  if(P.on&&Math.abs(P.vx)>110&&Math.random()<0.25)parts.push({x:P.x+P.w/2-P.face*4,y:P.y+P.h-2,vx:-P.face*20,vy:-20,life:0.35,col:'#ffffff88'});
  P.wasOn=P.on;P.lastVy=P.vy||P.lastVy;if(P.on)P.lastVy=0;
  if(!P.on)P.ride=null;
  if(P.on&&!P.ride){const cc=Math.floor((P.x+P.w/2)/T);if(lvl.ground[cc]&&lvl.ground[cc-1]&&lvl.ground[cc+1])lastSafe={x:P.x,y:P.y};}
  // hazards (lego)
  const hr0=Math.floor((P.y+4)/T),hr1=Math.floor((P.y+P.h-1)/T);
  for(let r=hr0;r<=hr1;r++)for(let c=c0;c<=c1;c++)if(tileAt(c,r)==='x'){const lx=c*T,ly=r*T+8;if(P.y+P.h>ly&&P.x+P.w>lx+2&&P.x<lx+14)hurt(lx+8);}

function updateEnemies(dt){
  for(const e of lvl.enemies){
    if(!e.alive){e.dead-=dt;continue;}
    if(Math.abs(e.x-P.x)>W)continue;
    e.t+=dt;
    const sp={dust:30,roach:55,roomba:75,cat:50,dog:90,rat:65,bee:40,spider:60,bat:55}[e.type]*(1+levelIdx*0.06);
    if(e.type==='bee'||e.type==='bat'){e.x+=e.vx*sp*dt;e.y=e.by+Math.sin(e.t*3)*22;if(Math.abs(e.x-e.ox)>60||e.ox===undefined){if(e.ox===undefined)e.ox=e.x;else{e.vx*=-1;e.x+=e.vx*2;}}}
    else{
      if(e.type==='cat'&&Math.sin(e.t*1.3)>0.6){/* cat sits and licks paw */}
      else e.x+=e.vx*sp*dt;
      if(e.type==='dog'&&e.vy===0&&Math.random()<dt*0.8)e.vy=-300;
      e.vy+=1300*dt;e.y+=e.vy*dt;
      const r=Math.floor((e.y+e.h)/T),cA=Math.floor((e.x+2)/T),cB=Math.floor((e.x+e.w-2)/T);
      if(solid(cA,r)||solid(cB,r)){e.y=r*T-e.h;e.vy=0;}
      const front=e.vx>0?Math.floor((e.x+e.w)/T):Math.floor(e.x/T),mr=Math.floor((e.y+e.h/2)/T);
      if(e.vy===0&&(solid(front,mr)||tileAt(front,mr)==='x'||!solid(front,Math.floor((e.y+e.h+2)/T))))e.vx*=-1;
      if(e.y>H+40)e.alive=false;
    }
    if(overlap(P,e)){
      if(P.vy>40&&P.y+P.h-e.y<10){e.alive=false;e.dead=0.5;P.vy=keys.jump?-420:-300;SFX.boing();score+=100;levelScore+=100;puff(e.x+7,e.y+6,"#ccc",10);popText(e.x,e.y-4,"+100","#ffeb3b");}
      else hurt(e.x+e.w/2);
    }
  }
  for(const m of lvl.movers){const ox=m.x;m.x+=m.dir*m.sp*dt;if(m.x>m.b){m.x=m.b;m.dir=-1;}if(m.x<m.a){m.x=m.a;m.dir=1;}m.dx=m.x-ox;}
}

function updateSibs(dt){
  const frac=timeLeft/lvl.L.time;

    sibs.push({k,d,x:cam+(k?W+10:-20),y:40,face:1,anim:0,target:null,hop:0});say(d.line,2.5);
    if(AC){const t0=AC.currentTime;[72,76,79,84].forEach((n,i)=>tone(mtof(n+k*2),0.12,'square',0.1,null,t0+i*0.07));}
    for(let i=0;i<14;i++)parts.push({x:P.x,y:P.y-10,vx:(Math.random()-.5)*200,vy:-Math.random()*150,life:1,col:k?"#43a047":"#ec407a"});}});
  for(const s of sibs){
    if(!s.target||s.target.got){s.target=null;let best=1e9;for(const it of lvl.items){if(it.got||sibs.some(o=>o!==s&&o.target===it))continue;const dd=Math.abs(it.x-s.x)+Math.abs(it.y-s.y);if(dd<best){best=dd;s.target=it;}}}
    const tx=s.target?s.target.x:P.x-20*s.face,ty=s.target?s.target.y-4:P.y-10;
    const dx=tx-s.x,dy=ty-s.y,dist=Math.hypot(dx,dy)||1,sp=s.d.speed*(s.target?1:0.8);
    if(dist>3){s.x+=dx/dist*Math.min(sp*dt,dist);s.y+=dy/dist*Math.min(sp*dt,dist);s.face=dx>0?1:-1;}
    s.anim+=sp*dt;s.hop+=dt*10;
    if(Math.random()<0.3)parts.push({x:s.x+5,y:s.y+15,vx:0,vy:20,life:0.3,col:"#fff9"});
    if(s.target&&!s.target.got&&Math.abs(s.target.x+8-(s.x+5))<12&&Math.abs(s.target.y+8-(s.y+7))<14){
      const it=s.target;it.got=true;P.carry++;score+=25;levelScore+=25;SFX.collect();puff(it.x+8,it.y+8,s.k?"#69f0ae":"#f48fb1",8);
      const left=lvl.total-P.carry;popText(it.x-6,it.y-4,left?s.d.name+"! "+left+" LEFT":"ALL DONE!","#fff");if(!left)say("NOW GET TO THE "+lvl.drop.kind.toUpperCase()+"! >>>",2.5);}
  }
}
function updatePlay(dt){
  timeLeft-=dt;updateSibs(dt);
  if(timeLeft<=10&&!honked){honked=true;SFX.honk();say("HONK HONK! THEY'RE CLOSE!",2);}
  updatePlayer(dt);updateEnemies(dt);
  for(const it of lvl.items){if(!it.got&&overlap(P,it)){it.got=true;P.carry++;score+=50;levelScore+=50;SFX.collect();puff(it.x+8,it.y+8,"#ffeb3b",8);
    const left=lvl.total-P.carry;popText(it.x-6,it.y-4,left?left+" LEFT":"ALL DONE!","#fff");if(!left)say("NOW GET TO THE "+lvl.drop.kind.toUpperCase()+"! >>>",2.5);}}
  if(overlap(P,lvl.drop)){
    if(P.carry>=lvl.total){
      const bonus=Math.ceil(timeLeft)*10;score+=bonus;levelScore+=bonus;state='clear';stateT=0;stopMusic();SFX.win();puff(lvl.drop.x+14,lvl.drop.y,"#ffeb3b",30,150);
    }else if(msgT<=0){SFX.nope();say("STILL "+(lvl.total-P.carry)+" "+ITEM_NAMES[lvl.L.item].toUpperCase()+" LEFT!",1.5);}

let ctx=g;

const SP=8,oc=document.createElement('canvas');oc.width=64;oc.height=56;const og=oc.getContext('2d');

const tileCache={};

function tiles(th){

  const mk=(fn)=>{const c=document.createElement('canvas');c.width=T;c.height=T;const x=c.getContext('2d');ctx=x;fn();ctx=g;return c;};
  const rnd=rngf(42);

    if(th.checker){R(0,0,8,8,'#f5f5f5');R(8,8,8,8,'#f5f5f5');R(8,0,8,8,'#37474f');R(0,8,8,8,'#37474f');R(0,0,16,1,'#fff6');R(0,0,1,16,'#fff6');}

  });

      if(k===1){g.fillStyle='#3e2723';g.beginPath();g.arc(dx+80,70,24,0,7);g.fill();g.fillStyle='#1a237e';g.beginPath();g.arc(dx+80,70,20,0,7);g.fill();R(dx+79,50,2,40,"#3e2723");R(dx+60,69,40,2,"#3e2723");g.fillStyle='#fff9c4';g.beginPath();g.arc(dx+88,62,6,0,7);g.fill();}
      if(k===2){R(dx+20,130,30,10,"#a1887f");R(dx+30,110,10,24,"#d7ccc8");R(dx+26,100,18,14,"#f5f5f5");R(dx+56,120,40,50,"#8d6e63");R(dx+60,110,10,14,"#8d6e63");R(dx+52,166,48,4,"#5d4037");}
      if(k===3){g.strokeStyle='#ffffff40';g.lineWidth=1;for(let w=0;w<4;w++){g.beginPath();g.moveTo(dx,w*10);g.lineTo(dx+40-w*8,0);g.stroke();}g.beginPath();g.moveTo(dx,0);g.lineTo(dx+30,30);g.stroke();}
    }else{
      if(k===0){R(dx+20,40,60,50,"#fff");R(dx+24,44,52,42,"#1a237e");R(dx+60,52,6,6,"#fff59d");}
      if(k===1){R(dx+20,50,40,30,"#ffeb3b");text("HOME",dx+24,60,8,"#e53935","left",false);}
      if(k===2){R(dx+30,60,40,40,"#e0e0e0");R(dx+48,64,2,16,"#000");R(dx+48,78,14,2,"#000");}
      if(k===3){R(dx+10,100,60,100,"#6d4c41");R(dx+56,150,6,6,"#ffd600");}
    }
  }
}

function drawTiles(th,t){
  const c0=Math.floor(cam/T),c1=c0+Math.ceil(W/T)+1;
  for(let c=c0;c<=c1;c++)for(let r=0;r<ROWS;r++){
    const tl=tileAt(c,r),x=c*T-cam,y=r*T;
    if(c<0||c>=lvl.cols)continue;
    if(tl==='#'){
      const top=tileAt(c,r-1)!=='#',tx=tiles(th);
      g.drawImage(top?tx.top:tx.fill,Math.round(x),y);
      const depth=r-(ROWS-lvl.ground[c]);if(depth>0){g.globalAlpha=Math.min(0.5,depth*0.12);R(x,y,T,T,'#000');g.globalAlpha=1;}
      if(top&&tileAt(c-1,r)!=='#')R(x,y,1,T,shade(th.top,40));
      if(top&&tileAt(c+1,r)!=='#')R(x+15,y,1,T,'#0006');
    }else if(tl==='='){
      R(x,y,T,7,th.plat);R(x,y,T,2,th.ptop);R(x,y+6,T,1,shade(th.plat,-40));R(x+((c*5)%11),y+3,4,1,shade(th.plat,-20));
      if(tileAt(c-1,r)!=='=')R(x,y,1,7,th.ptop);if(tileAt(c+1,r)!=='=')R(x+15,y,1,7,shade(th.plat,-40));
      g.globalAlpha=0.25;R(x,y+7,T,3,'#000');g.globalAlpha=1;
      if(tileAt(c-1,r)!=='=')R(x+2,y+7,2,5,shade(th.plat,-30));if(tileAt(c+1,r)!=='=')R(x+12,y+7,2,5,shade(th.plat,-30));
    }
    else if(tl==='x'){outlined(x,y,(ox,oy)=>{R(ox+2,oy+10,12,6,"#e53935");R(ox+3,oy+8,3,2,"#ef5350");R(ox+10,oy+8,3,2,"#ef5350");R(ox+2,oy+10,12,1,"#ff8a80");R(ox+2,oy+15,12,1,"#b71c1c");R(ox+4,oy+8,1,1,"#ffcdd2");R(ox+11,oy+8,1,1,"#ffcdd2");});}
  }
  for(const m of lvl.movers){const x=m.x-cam;outlined(x,m.y,(ox,oy)=>{R(ox,oy,m.w,8,"#ffb300");R(ox,oy,m.w,2,"#ffe082");R(ox,oy+7,m.w,1,"#e65100");for(let i=4;i<m.w;i+=10)R(ox+i,oy+3,4,3,"#ff6f00");});
    g.globalAlpha=0.5;R(x+m.w/2-1,m.y+8,2,4+Math.sin(clock*20)*2,'#fff');g.globalAlpha=1;}
}

function drawHUD(t){
  const hg=g.createLinearGradient(0,0,0,28);hg.addColorStop(0,'#2a1d5cee');hg.addColorStop(1,'#120c24ee');g.fillStyle=hg;g.fillRect(0,0,W,28);R(0,27,W,1,'#ffeb3b');R(0,28,W,2,'#0006');
  const L=lvl.L;
  // chores
  drawItem(L.item==='mix'?"trash":L.item,4,6,0,false);
  text(P.carry+"/"+lvl.total,24,10,8,P.carry>=lvl.total?"#76ff03":"#fff");
  text("SCORE "+score,70,10,8,"#ffeb3b");
  // parent car meter
  const mx=220,mw=180,frac=1-timeLeft/L.time;
  R(mx,14,mw,3,"#555");for(let i=0;i<mw;i+=12)R(mx+i,15,6,1,"#ffeb3b");
  // house
  R(mx+mw+4,8,16,12,"#e53935");R(mx+mw+2,4,20,5,"#b71c1c");R(mx+mw+10,13,4,7,"#3e2723");
  const cx=mx+frac*(mw-16),bump=Math.floor(t*10)%2;
  R(cx,9+bump,18,6,"#1e88e5");R(cx+4,5+bump,9,5,"#64b5f6");R(cx+2,14,4,4,"#212121");R(cx+12,14,4,4,"#212121");
  const urgent=timeLeft<15;
  const secs=Math.ceil(timeLeft);text(secs+"s",mx-6,10,8,urgent&&Math.floor(t*6)%2?"#ff1744":"#fff","right");
  text("LV"+(levelIdx+1),W-4,22,6,"#aaa","right",false);
}

function drawPlay(t){
  const th=lvl.theme;
  drawBackground(th,t);
  drawTiles(th,t);
  g.save();g.translate(-Math.round(cam),0);
  drawDrop(lvl.drop,P.carry>=lvl.total,t);
  for(const it of lvl.items)if(!it.got&&Math.abs(it.x-cam-W/2)<W)drawItem(it.kind,it.x,it.y+Math.sin(t*4+it.bob)*2,t);
  for(const e of lvl.enemies)if(Math.abs(e.x-cam-W/2)<W)drawEnemy(e,t);
  for(const s of sibs){const by=s.y+Math.sin(s.hop)*2;
    g.save();g.translate(Math.round(s.x),Math.round(by));g.scale(1.6,1.6);
    outlined(0,0,(ox,oy)=>{drawKidRaw(ox,oy,s.face,s.anim/2,true,s.d.pal);R(ox-2,oy+15,15,2,s.k?"#1e88e5":"#ab47bc");R(ox,oy+17,2,2,"#212121");R(ox+9,oy+17,2,2,"#212121");});g.restore();
    text(s.d.name,s.x+8,by-14,6,s.k?"#69f0ae":"#f48fb1","center");}
  const kg=groundBelow(P.x+P.w/2,P.y+P.h-2);if(kg!==null)shadow(P.x+P.w/2,kg,6*Math.max(0.4,1-(kg-P.y-P.h)/120),0.35);
  const st=P.sq||0,sx=1+st*0.35,sy=1-st*0.3+(!P.on&&P.vy<-100?0.12:0);
  drawKid(P.x,P.y,P.face,P.anim/2,!P.on,P.inv>0?P.inv:0,sx,sy);
  for(const p of parts){g.globalAlpha=Math.min(1,p.life*2);if(p.txt)text(p.txt,p.x,p.y,8,p.col);else{const z=p.life>0.5?3:2;R(p.x,p.y,z,z,p.col);}}
  g.globalAlpha=1;g.restore();
  if(timeLeft<15){g.globalAlpha=0.12+0.1*Math.sin(t*10);R(0,0,W,H,"#ff1744");g.globalAlpha=1;}
  if(th.dark){g.save();const lx=P.x-cam+5,ly=P.y+6,dg=g.createRadialGradient(lx,ly,30,lx,ly,170);dg.addColorStop(0,'rgba(0,0,10,0)');dg.addColorStop(1,'rgba(0,0,10,0.6)');g.fillStyle=dg;g.fillRect(0,0,W,H);g.restore();}
  g.drawImage(fx,0,0);
  drawHUD(t);
  if(msgT>0)text(msg,W/2,44,8,"#fff","center");
  // arrow to drop when done
  if(P.carry>=lvl.total&&lvl.drop.x-cam>W){text(">>>",W-30,H/2,10,Math.floor(t*4)%2?"#ffeb3b":"#fff");}
}

function panel(){g.globalAlpha=0.5;R(0,0,W,H,'#000');g.globalAlpha=0.92;const pg=g.createLinearGradient(0,30,0,H-30);pg.addColorStop(0,'#2d1f6e');pg.addColorStop(1,'#120a30');g.fillStyle=pg;g.fillRect(30,30,W-60,H-60);g.globalAlpha=1;
  R(30,30,W-60,3,"#ffeb3b");R(30,H-33,W-60,3,"#ffeb3b");R(30,30,3,H-60,"#ffeb3b");R(W-33,30,3,H-60,"#ffeb3b");R(33,33,W-66,1,"#fff5");
  for(const [cx,cy] of [[30,30],[W-36,30],[30,H-36],[W-36,H-36]])R(cx,cy,6,6,"#e53935");}

function drawTitle(t){
  // starry retro bg
  R(0,0,W,H,"#1a1040");
  for(let i=0;i<60;i++){const x=(i*97+t*20*(1+i%3))%W,y=(i*53)%H;R(x,y,2,2,i%5?"#5c4db1":"#fff");}
  for(let y=170;y<H;y+=8)R(0,y,W,1,"#e5393566");
  const wob=Math.sin(t*3)*3;
  text("CHORE",W/2,40+wob,32,"#ffeb3b","center");
  text("RUSH!",W/2,78-wob,32,"#e53935","center");
  text("BEAT THE PARENTS HOME",W/2,124,8,"#fff","center");
  drawKid(W/2-10,152+Math.abs(Math.sin(t*5))*-14,1,t*40,Math.sin(t*5)>0.3,0);
  drawItem("sock",W/2-60,154+Math.sin(t*4)*3);drawItem("dish",W/2+50,154+Math.cos(t*4)*3);
  drawItem("toy",W/2-100,160+Math.cos(t*3)*3);drawItem("leaf",W/2+90,160+Math.sin(t*3)*3);
  if(soundGate)text("CLICK OR PRESS ANY KEY FOR SOUND",W/2,200,8,Math.floor(t*2)%2?"#ffeb3b":"#fff","center");
  else if(Math.floor(t*2)%2)text("PRESS ENTER / TAP TO START",W/2,200,8,"#76ff03","center");
  text("ARROWS/WASD MOVE  SPACE JUMP  M MUTE  P PAUSE",W/2,226,6,"#aaa","center",false);
  text("STOMP CRITTERS. DODGE LEGOS. DON'T FALL.",W/2,240,6,"#aaa","center",false);
  text("MADE BY ISAAC HELTON & PETE O'CONNELL",W/2,256,6,"#ffeb3b","center");
  g.drawImage(fx,0,0);
}

function drawIntro(t){
  drawPlay(t);panel();
  const L=lvl.L;
  text("LEVEL "+(levelIdx+1),W/2,44,8,"#aaa","center");
  text(L.name,W/2,60,12,"#ffeb3b","center");
  // phone text bubble
  R(70,86,W-140,58,"#e0e0e0");R(70,86,W-140,10,"#43a047");text("NEW TEXT!",78,88,6,"#fff","left",false);
  g.save();wrap(L.text,W/2,102,W-160,8,"#212121");g.restore();
  text("CHORE: "+L.chore,W/2,156,8,"#fff","center");
  drawItem(L.item==='mix'?'trash':L.item,W/2-62,172,clock);text("x"+lvl.total+"  in "+L.time+" SEC",W/2+8,177,8,"#76ff03","center");
  text("NOW PLAYING: "+(L.music==='mix'?"ALL OF IT AT ONCE!":STYLES[L.music].name),W/2,196,6,"#ff80ab","center");
  if(stateT>0.8&&Math.floor(t*2)%2)text("PRESS ENTER / TAP!",W/2,212,8,"#fff","center");
}
const WIN_LINES=["Mom: Wow. Did a robot do this?","Dad: I'm suspicious... but proud.","Mom: Is this even our house?!","Dad: Who are you and what did you do with our kid?"];
const LOSE_LINES=["MOM: WHY IS THERE A SOCK IN THE FRIDGE?!","DAD: YOU'RE GROUNDED UNTIL YOU'RE 40!","MOM: NO VIDEO GAMES FOR A MILLION YEARS!","DAD: IS THAT... A PANCAKE ON THE CAT?"];
function drawClear(t){
  drawPlay(t);panel();
  text("CHORE COMPLETE!",W/2,48,14,"#76ff03","center");
  wrap(WIN_LINES[levelIdx%WIN_LINES.length],W/2,82,W-110,8,"#fff");
  text("TIME BONUS: "+Math.ceil(timeLeft)+" x 10",W/2,124,8,"#ffeb3b","center");
  text("LEVEL SCORE: "+levelScore,W/2,142,8,"#ffeb3b","center");
  text("TOTAL: "+score,W/2,160,8,"#fff","center");
  drawKid(W/2-10,180-Math.abs(Math.sin(t*6))*12,1,0,true,0);
  if(stateT>1&&Math.floor(t*2)%2)text(levelIdx<LEVELS.length-1?"ENTER / TAP: NEXT CHORE":"ENTER / TAP: ...",W/2,214,8,"#fff","center");
}
function drawLose(t){
  drawPlay(t);panel();
  const shake=stateT<1?(Math.random()-.5)*6:0;
  text("PARENTS ARE HOME!",W/2+shake,48,14,"#ff1744","center");
  wrap(LOSE_LINES[(levelIdx+Math.floor(score/50))%LOSE_LINES.length],W/2,82,W-110,8,"#fff");
  // parents silhouettes, angry
  for(let i=0;i<2;i++){const px=W/2-40+i*60;R(px,130,20,40,i?"#5e35b1":"#00897b");R(px+3,116,14,14,"#f5c08a");R(px+5,121,3,2,"#000");R(px+12,121,3,2,"#000");R(px+6,126,8,2,"#b71c1c");R(px+4,119,5,1,"#000");R(px+11,119,5,1,"#000");}
  text("!!",W/2+5,110,12,"#ff1744","center");
  text(P.carry+"/"+lvl.total+" "+ITEM_NAMES[lvl.L.item].toUpperCase()+" DONE",W/2,182,8,"#ffeb3b","center");
  if(stateT>1.2&&Math.floor(t*2)%2)text("ENTER / TAP: TRY AGAIN",W/2,210,8,"#fff","center");
}
function drawEnd(t){
  R(0,0,W,H,"#1a1040");
  for(let i=0;i<40;i++){const x=(i*61+t*60)%W,y=(i*37+t*(30+i))%H;R(x,y,3,3,["#ffeb3b","#e53935","#76ff03","#40c4ff"][i%4]);}
  text("YOU DID IT!!",W/2,40,20,"#ffeb3b","center");
  wrap("Every chore done before the parents got home. They are so confused they are taking you out for pizza AND ice cream.",W/2,80,W-80,8,"#fff");
  text("FINAL SCORE: "+score,W/2,160,10,"#76ff03","center");
  drawKid(W/2-10,180-Math.abs(Math.sin(t*6))*16,Math.sin(t*2)>0?1:-1,t*40,true,0);
  if(stateT>1.5&&Math.floor(t*2)%2)text("ENTER / TAP: PLAY AGAIN",W/2,226,8,"#fff","center");
  text("MADE BY ISAAC HELTON & PETE O'CONNELL",W/2,250,8,"#ffeb3b","center");
}

// ================= MAIN LOOP =================
let last=performance.now(),acc=0,clock=0;
function frame(now){
  let dt=Math.min(0.1,(now-last)/1000);last=now;acc+=dt;
  const STEP=1/60;
  while(acc>=STEP){
    acc-=STEP;clock+=STEP;stateT+=STEP;if(msgT>0)msgT-=STEP;
    const pressed=anyPress;anyPress=false;
    if(state==='title'){if(pressed){if(soundGate){soundGate=false;initAudio();}else{score=0;startLevel(0);}}else if(soundGate&&soundReady())soundGate=false;}
    else if(state==='intro'){if(pressed&&stateT>0.5){state='play';jumpPressed=false;startMusic(lvl.L.music);}}
    else if(state==='play'){updatePlay(STEP);updateParts(STEP);}
    else if(state==='clear'){updateParts(STEP);if(pressed&&stateT>1){if(levelIdx<LEVELS.length-1)startLevel(levelIdx+1);else{state='end';stateT=0;startMusic('mix');}}}
    else if(state==='lose'){if(pressed&&stateT>1.2){score=Math.max(0,score-levelScore);startLevel(levelIdx);}}
    else if(state==='end'){if(pressed&&stateT>1.5){state='title';stateT=0;startMusic('french');}}
    jumpPressed=false;
  }
  if(state==='title'){drawTitle(clock);if(AC&&!music.on)startMusic('french');}
  else if(state==='intro')drawIntro(clock);
  else if(state==='play')drawPlay(clock);
  else if(state==='pause'){drawPlay(clock);panel();text("PAUSED",W/2,110,16,"#ffeb3b","center");text("P TO RESUME",W/2,140,8,"#fff","center");}
  else if(state==='clear')drawClear(clock);
  else if(state==='lose')drawLose(clock);
  else if(state==='end')drawEnd(clock);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
