<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chore Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#120c24;--fg:#fff}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center;font-family:"Press Start 2P",monospace}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;box-shadow:0 0 0 4px #fff,0 0 0 8px #e53935,0 0 40px #000}
#touch{position:fixed;inset:auto 0 0 0;display:none;justify-content:space-between;padding:16px;pointer-events:none}
#touch .grp{display:flex;gap:14px}
#touch button{pointer-events:auto;width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:rgba(229,57,53,.55);color:#fff;font:16px "Press Start 2P",monospace;touch-action:none}
#touch button.j{background:rgba(255,193,7,.6);width:88px;height:88px}
@media (pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>
<canvas id="c" width="480" height="272"></canvas>
<div id="touch">
  <div class="grp"><button data-k="left">&#9664;</button><button data-k="right">&#9654;</button></div>
  <div class="grp"><button data-k="duck">DUCK</button><button class="j" data-k="jump">JUMP</button></div>
</div>
<script>
"use strict";
// ================= SETUP =================
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=480,H=272,T=16,ROWS=17;
g.imageSmoothingEnabled=false;
function fit(){const s=Math.max(1,Math.min(innerWidth/W,innerHeight/H)*0.96);cv.style.width=(W*s|0)+'px';cv.style.height=(H*s|0)+'px';}
addEventListener('resize',fit);fit();
const FONT='"Press Start 2P",monospace';

// ================= INPUT =================
const keys={left:false,right:false,jump:false,duck:false};let jumpPressed=false,anyPress=false;
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyZ:'jump',ArrowDown:'duck',KeyS:'duck'};
addEventListener('keydown',e=>{
  initAudio();
  const k=KM[e.code];
  if(k){if(k==='jump'&&!keys.jump)jumpPressed=true;keys[k]=true;e.preventDefault();}
  if(e.code==='Enter'||e.code==='Space')anyPress=true;
  if(e.code==='KeyM')toggleMute();
  if(state==='title'&&!soundGate&&e.code==='KeyL'){openSelect();return;}
  if(state==='clear'&&stateT>1&&e.code==='KeyL'){selIdx=Math.min(levelIdx+1,LEVELS.length-1);openSelect();return;}
  if(state==='select'){selectKey(e.code);e.preventDefault();return;}
  if(e.code==='KeyP'||e.code==='Escape'){if(state==='play')state='pause';else if(state==='pause')state='play';}
});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=false;});
document.querySelectorAll('#touch button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();if(k==='jump'){jumpPressed=true;anyPress=true;}keys[k]=true;});
  const up=e=>{keys[k]=false;};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
});
document.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('#touch'))return;initAudio();
  const r=cv.getBoundingClientRect(),cx=(e.clientX-r.left)*W/r.width,cy=(e.clientY-r.top)*H/r.height;
  if(state==='title'&&!soundGate&&inBox(cx,cy,SELECT_BTN)){openSelect();return;}
  if(state==='clear'&&stateT>1&&inBox(cx,cy,CLEAR_SEL_BTN)){selIdx=Math.min(levelIdx+1,LEVELS.length-1);openSelect();return;}
  if(state==='select'){selectTap(cx,cy);return;}
  anyPress=true;});
// Browsers keep audio muted until the player interacts, so the title screen asks for one click/key first
const soundReady=()=>AC&&AC.state==='running';
let soundGate=true;
// Try to start the title music the moment the page opens. Browsers only allow this if the player has
// already interacted with the site (or allowed autoplay); otherwise it starts on the very first click/tap/key.
addEventListener('load',()=>{try{initAudio();}catch(e){}});
['mousedown','touchend','click','keyup'].forEach(ev=>addEventListener(ev,()=>initAudio(),{passive:true}));

// ================= AUDIO =================
let AC=null,master=null,musicGain=null,sfxGain=null,muted=false,noiseBuf=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);
  musicGain=AC.createGain();musicGain.gain.value=0.38;musicGain.connect(master);
  sfxGain=AC.createGain();sfxGain.gain.value=0.8;sfxGain.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  setInterval(scheduler,25);
}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:0.5;}
const mtof=n=>440*Math.pow(2,(n-69)/12);
function tone(f,dur,type='square',vol=0.2,slide=null,t=null,dest=null){
  if(!AC)return;t=t??AC.currentTime;
  const o=AC.createOscillator(),ga=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  ga.gain.setValueAtTime(vol,t);ga.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(ga);ga.connect(dest||sfxGain);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,vol,hp=1000,t=null,dest=null){
  if(!AC)return;t=t??AC.currentTime;
  const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
  const ga=AC.createGain();ga.gain.setValueAtTime(vol,t);ga.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(ga);ga.connect(dest||sfxGain);s.start(t);s.stop(t+dur+0.02);
}
// kazoo lead: buzzy saw through a bandpass with wobbly vibrato
// soft lead for background music: mellow square+triangle through a lowpass, gentle vibrato
function softLead(f,dur,t,vol=0.06){
  const o=AC.createOscillator(),o2=AC.createOscillator(),lp=AC.createBiquadFilter(),ga=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();
  o.type='triangle';o2.type='square';o.frequency.value=f;o2.frequency.value=f*1.003;
  lfo.frequency.value=5;lg.gain.value=f*0.004;lfo.connect(lg);lg.connect(o.frequency);
  lp.type='lowpass';lp.frequency.value=1600;lp.Q.value=0.5;
  const g2=AC.createGain();g2.gain.value=0.25;o2.connect(g2);g2.connect(lp);o.connect(lp);
  ga.gain.setValueAtTime(0,t);ga.gain.linearRampToValueAtTime(vol,t+0.015);ga.gain.exponentialRampToValueAtTime(vol*0.5,t+dur*0.6);ga.gain.linearRampToValueAtTime(0,t+dur);
  lp.connect(ga);ga.connect(musicGain);[o,o2,lfo].forEach(x=>{x.start(t);x.stop(t+dur+0.05);});
}
function kazoo(f,dur,t,vol=0.13){
  const o=AC.createOscillator(),o2=AC.createOscillator(),bp=AC.createBiquadFilter(),ga=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();
  o.type='sawtooth';o2.type='square';o.frequency.value=f;o2.frequency.value=f*1.005;
  lfo.frequency.value=6.5;lg.gain.value=f*0.018;lfo.connect(lg);lg.connect(o.frequency);lg.connect(o2.frequency);
  bp.type='bandpass';bp.frequency.value=1400;bp.Q.value=1.6;
  ga.gain.setValueAtTime(0,t);ga.gain.linearRampToValueAtTime(vol,t+0.02);ga.gain.setValueAtTime(vol,t+dur*0.7);ga.gain.linearRampToValueAtTime(0,t+dur);
  // little "scoop" up into the note — very silly
  o.frequency.setValueAtTime(f*0.94,t);o.frequency.linearRampToValueAtTime(f,t+0.05);
  o.connect(bp);o2.connect(bp);bp.connect(ga);ga.connect(musicGain);
  [o,o2,lfo].forEach(x=>{x.start(t);x.stop(t+dur+0.05);});
}
const SFX={
  jump(){tone(300,0.18,'sine',0.25,900);},                          // slide whistle up
  boing(){tone(180,0.3,'square',0.18,720);tone(360,0.3,'triangle',0.15,90);},
  collect(){const t=AC&&AC.currentTime;if(!AC)return;[0,4,7,12].forEach((n,i)=>tone(mtof(76+n),0.09,'square',0.12,null,t+i*0.05));},
  hurt(){tone(400,0.5,'sawtooth',0.18,80);noise(0.2,0.2,300);},
  fall(){tone(900,0.9,'sine',0.25,60);},                            // slide whistle down
  honk(){if(!AC)return;const t=AC.currentTime;[0,0.22].forEach(d=>{tone(330,0.16,'sawtooth',0.18,null,t+d);tone(415,0.16,'sawtooth',0.14,null,t+d);});},
  nope(){tone(160,0.15,'square',0.15);tone(120,0.2,'square',0.15,null,AC&&AC.currentTime+0.15);},
  win(){if(!AC)return;const t=AC.currentTime;[72,76,79,84,79,84].forEach((n,i)=>kazoo(mtof(n),i==5?0.6:0.14,t+i*0.13,0.2));},
  lose(){if(!AC)return;const t=AC.currentTime;[67,66,65].forEach((n,i)=>tone(mtof(n-12),0.4,'sawtooth',0.2,null,t+i*0.45));tone(mtof(52),1.3,'sawtooth',0.2,mtof(48),t+1.35);},
  fart(){if(!AC)return;tone(90,0.35,'sawtooth',0.25,55);noise(0.3,0.08,100);}
};
// ---- music sequencer ----
const _=null;
const SONG={
  lead:[72,_,76,79, 81,79,76,_, 77,_,74,77, 76,72,_,_,
        72,_,76,79, 84,_,83,81, 79,77,76,74, 72,_,67,_,
        69,_,72,69, 71,_,74,71, 72,_,76,72, 74,79,_,_,
        77,76,75,74, 73,72,71,_, 79,_,67,_, 72,_,_,_],
  roots:[48,53,48,55,57,55,53,55],
};
function stopMusic(){music.on=false;}
// ---- MIDI-rock instruments: overdriven rhythm guitar, lead guitar, picked bass, rock kit ----
let gtrBus=null,leadBus=null;
function distCurve(k){const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x));}return c;}
function makeAmp(drive,tone,vol){ // waveshaper "amp" + cabinet filtering
  const inp=AC.createGain(),ws=AC.createWaveShaper(),hp=AC.createBiquadFilter(),lp=AC.createBiquadFilter(),mid=AC.createBiquadFilter(),out=AC.createGain();
  ws.curve=distCurve(drive);ws.oversample='4x';hp.type='highpass';hp.frequency.value=90;lp.type='lowpass';lp.frequency.value=tone;
  mid.type='peaking';mid.frequency.value=800;mid.gain.value=4;out.gain.value=vol;
  inp.connect(ws);ws.connect(hp);hp.connect(mid);mid.connect(lp);lp.connect(out);out.connect(musicGain);return inp;
}
function gtrNote(freqs,dur,t,vol,mute){ // power chord: detuned saws into the amp
  if(!gtrBus)gtrBus=makeAmp(60,3200,0.12);
  const ga=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=mute?700:2600;
  ga.gain.setValueAtTime(vol,t);ga.gain.exponentialRampToValueAtTime(vol*(mute?0.05:0.5),t+dur);ga.gain.linearRampToValueAtTime(0,t+dur+0.03);
  freqs.forEach(fr=>{[0,-7].forEach(det=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=fr;o.detune.value=det;o.connect(f);o.start(t);o.stop(t+dur+0.05);});});
  f.connect(ga);ga.connect(gtrBus);
}
function leadGtr(fr,dur,t,vol=0.5){
  if(!leadBus)leadBus=makeAmp(25,3800,0.11);
  const o=AC.createOscillator(),o2=AC.createOscillator(),ga=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();
  o.type='sawtooth';o2.type='square';o.frequency.value=fr;o2.frequency.value=fr*2.002;
  lfo.frequency.value=5.5;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(fr*0.012,t+Math.min(dur,0.4));lfo.connect(lg);lg.connect(o.frequency);lg.connect(o2.frequency);
  const g2=AC.createGain();g2.gain.value=0.3;o2.connect(g2);g2.connect(ga);o.connect(ga);
  o.frequency.setValueAtTime(fr*0.97,t);o.frequency.linearRampToValueAtTime(fr,t+0.04); // pick bend
  ga.gain.setValueAtTime(0,t);ga.gain.linearRampToValueAtTime(vol,t+0.01);ga.gain.setValueAtTime(vol*0.8,t+dur*0.8);ga.gain.linearRampToValueAtTime(0,t+dur);
  ga.connect(leadBus);[o,o2,lfo].forEach(x=>{x.start(t);x.stop(t+dur+0.05);});
}
function bassNote(fr,dur,t){
  const o=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter(),ga=AC.createGain();
  o.type='sawtooth';o2.type='triangle';o.frequency.value=fr;o2.frequency.value=fr;f.type='lowpass';f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(250,t+dur);
  ga.gain.setValueAtTime(0.22,t);ga.gain.exponentialRampToValueAtTime(0.05,t+dur);ga.gain.linearRampToValueAtTime(0,t+dur+0.02);
  o.connect(f);o2.connect(f);f.connect(ga);ga.connect(musicGain);[o,o2].forEach(x=>{x.start(t);x.stop(t+dur+0.05);});
}
// ================= MULTI-STYLE MUSIC ENGINE =================
// Every level gets its own genre. Each style: bpm, spb (steps per beat), bar (steps per bar), bars (bars per loop), play(step,time,stepDur)
let revIn=null;
function reverb(){
  if(revIn)return revIn;
  const len=AC.sampleRate*2.4|0,ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);}
  const cv=AC.createConvolver();cv.buffer=ir;const wet=AC.createGain();wet.gain.value=0.45;cv.connect(wet);wet.connect(musicGain);return revIn=cv;
}
function out(vol,send){const ga=AC.createGain();ga.connect(musicGain);if(send){const s=AC.createGain();s.gain.value=send;ga.connect(s);s.connect(reverb());}return ga;}
function O(type,f,t,end,dest,gain=1){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);let n=o;if(gain!==1){const g2=AC.createGain();g2.gain.value=gain;o.connect(g2);n=g2;}n.connect(dest);o.start(t);o.stop(end);return o;}
function decayEnv(ga,t,vol,len,a=0.005){ga.gain.setValueAtTime(0,t);ga.gain.linearRampToValueAtTime(vol,t+a);ga.gain.exponentialRampToValueAtTime(0.0008,t+len);}
function holdEnv(ga,t,vol,dur,a=0.02,rel=0.08){ga.gain.setValueAtTime(0,t);ga.gain.linearRampToValueAtTime(vol,t+a);ga.gain.setValueAtTime(vol,t+Math.max(a,dur-rel));ga.gain.linearRampToValueAtTime(0,t+dur);}
// --- instruments ---
function piano(m,dur,t,vol=0.12,send=0.35){const f=mtof(m),ga=out(vol,send),len=Math.max(0.6,dur)+0.9;
  decayEnv(ga,t,vol,len,0.004);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(f*8,t);lp.frequency.exponentialRampToValueAtTime(f*2,t+len);lp.connect(ga);
  O('triangle',f,t,t+len,lp);O('sine',f*2,t,t+len,lp,0.35);O('sine',f*3.01,t,t+len,lp,0.08);O('sine',f*0.5,t,t+len,lp,m<55?0.25:0);}
function organ(m,dur,t,vol=0.04,send=0.6){const f=mtof(m),ga=out(1,send);holdEnv(ga,t,vol,dur,0.015,0.05);
  [[1,1],[2,0.75],[3,0.3],[4,0.45],[6,0.12],[8,0.22]].forEach(([h,w])=>{if(f*h<9000)O('sine',f*h,t,t+dur+0.05,ga,w);});}
function epiano(m,dur,t,vol=0.08,send=0.2){const f=mtof(m),ga=out(1,send);decayEnv(ga,t,vol,dur+0.5,0.005);
  const c=O('sine',f,t,t+dur+0.6,ga),mod=AC.createOscillator(),mg=AC.createGain();mod.frequency.value=f;mg.gain.setValueAtTime(f*1.8,t);mg.gain.exponentialRampToValueAtTime(f*0.1,t+0.5);
  mod.connect(mg);mg.connect(c.frequency);mod.start(t);mod.stop(t+dur+0.6);O('sine',f*4,t,t+0.15,ga,0.08);}
function sax(m,dur,t,vol=0.07,send=0.25){const f=mtof(m),ga=out(1,send);holdEnv(ga,t,vol,dur,0.03,0.06);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2000;lp.Q.value=1.5;const pk=AC.createBiquadFilter();pk.type='peaking';pk.frequency.value=1100;pk.gain.value=7;lp.connect(pk);pk.connect(ga);
  const o=O('sawtooth',f*0.96,t,t+dur+0.05,lp);o.frequency.linearRampToValueAtTime(f,t+0.05);
  const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=5.2;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*0.01,t+Math.min(dur,0.35));l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur+0.05);}
function popLead(m,dur,t,vol=0.045,send=0.25){const f=mtof(m),ga=out(1,send);holdEnv(ga,t,vol,dur,0.01,0.05);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3800;lp.connect(ga);O('square',f,t,t+dur+0.05,lp).detune.value=-7;O('square',f,t,t+dur+0.05,lp).detune.value=7;O('sine',f*2,t,t+dur+0.05,lp,0.3);}
function pluck(m,dur,t,vol=0.04,send=0.2,bright=3000){const f=mtof(m),ga=out(1,send);decayEnv(ga,t,vol,Math.min(0.5,dur+0.15),0.003);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(bright,t);lp.frequency.exponentialRampToValueAtTime(300,t+0.2);lp.connect(ga);O('sawtooth',f,t,t+0.6,lp);O('square',f*1.004,t,t+0.6,lp,0.5);}
function subBass(m,dur,t,vol=0.32){const f=mtof(m),ga=out(1,0);holdEnv(ga,t,vol,dur,0.005,0.08);const o=O('sine',f*1.5,t,t+dur+0.05,ga);o.frequency.exponentialRampToValueAtTime(f,t+0.04);O('triangle',f*2,t,t+dur+0.05,ga,0.15);}
function synthBass(m,dur,t,vol=0.16){const f=mtof(m),ga=out(1,0);holdEnv(ga,t,vol,dur,0.004,0.03);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(1400,t);lp.frequency.exponentialRampToValueAtTime(300,t+dur);lp.connect(ga);O('sawtooth',f,t,t+dur+0.05,lp);O('square',f/2,t,t+dur+0.05,lp,0.5);}
function acid(m,dur,t,cut,vol=0.1){const f=mtof(m),ga=out(1,0.08);holdEnv(ga,t,vol,dur,0.003,0.02);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.Q.value=13;
  lp.frequency.setValueAtTime(cut*3,t);lp.frequency.exponentialRampToValueAtTime(Math.max(120,cut*0.6),t+dur);lp.connect(ga);O('sawtooth',f,t,t+dur+0.05,lp);}
function flute(m,dur,t,vol=0.06){const f=mtof(m),ga=out(1,0.6);holdEnv(ga,t,vol,dur,0.09,0.15);
  const o=O('sine',f,t,t+dur+0.05,ga);O('triangle',f*2,t,t+dur+0.05,ga,0.08);
  const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=4.8;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*0.006,t+Math.min(dur,0.5));l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur+0.05);
  nz(Math.min(dur,0.25),0.008,'bandpass',f*2,t,2);}
function accordion(m,dur,t,vol=0.03){const f=mtof(m),ga=out(1,0.2);holdEnv(ga,t,vol,dur,0.02,0.04);
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1500;bp.Q.value=0.6;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4200;bp.connect(lp);lp.connect(ga);
  [-14,0,14].forEach(c=>{O('sawtooth',f,t,t+dur+0.05,bp).detune.value=c;});O('square',f/2,t,t+dur+0.05,bp,0.4);} // musette tremolo = wobbly 3-reed accordion
function trumpet(m,dur,t,vol=0.06){const f=mtof(m),ga=out(1,0.25);holdEnv(ga,t,vol,dur,0.03,0.05);

function rngf(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function buildLevel(idx){
  const L=LEVELS[idx],rng=rngf(L.seed??(777+idx*1013)),cols=L.len;
  const ri=(a,b)=>a+Math.floor(rng()*(b-a+1));
  const map=[];for(let r=0;r<ROWS;r++)map.push(new Array(cols).fill('.'));
  const ground=new Array(cols).fill(0),plats=[],spots=[],eSpots=[],movers=[],legos=[];
  let x=0,h=3;
  for(;x<10;x++)ground[x]=h;
  while(x<cols-16){
    const r=rng();
    if(r<0.22){ // pit
      if(L.movers&&rng()<0.5){
        const gp=ri(6,8),gy=(ROWS-h)*T;
        movers.push({x:(x+1)*T,y:gy,w:3*T,h:8,a:(x+0.5)*T,b:(x+gp-3.5)*T,sp:40+idx*6,dir:1,dx:0});
        for(let i=0;i<gp;i++)ground[x++]=0;
        spots.push({x:x-gp/2,row:ROWS-h-3});
      }else{
        const gp=ri(2,1+L.gap);
        for(let i=0;i<gp;i++)ground[x++]=0;
        spots.push({x:x-gp/2-0.5,row:ROWS-h-3});
      }
      const run=ri(3,5);for(let i=0;i<run;i++)ground[x++]=h;
    }else if(r<0.45){ // step
      let nh=h+[-2,-1,1,2,3][ri(0,4)];nh=Math.max(2,Math.min(8,nh));h=nh;
      const run=ri(3,6);for(let i=0;i<run;i++)ground[x++]=h;
      spots.push({x:x-2,row:ROWS-h-1});
      if(run>=5&&rng()<L.density*0.6)eSpots.push({x:x-3,row:ROWS-h-1});
    }else if(r<0.7){ // shelf platform(s)
      const run=ri(8,11);for(let i=0;i<run;i++)ground[x+i]=h;
      const pl=ri(3,4),px=x+2,prow=ROWS-h-3;
      plats.push({x:px,row:prow,len:pl});spots.push({x:px+1,row:prow-1});
      if(idx>=1&&rng()<0.5&&prow-3>=3){const p2=px+pl,pr2=prow-3;plats.push({x:p2,row:pr2,len:3});spots.push({x:p2+1,row:pr2-1});}
      if(rng()<L.density)eSpots.push({x:x+run-2,row:ROWS-h-1});
      x+=run;
    }else{ // flat run with enemy or lego
      const run=ri(6,10);for(let i=0;i<run;i++)ground[x+i]=h;
      if(L.lego&&rng()<L.lego){legos.push({x:x+ri(2,run-3),row:ROWS-h-1});spots.push({x:x+1,row:ROWS-h-1});}
      else if(rng()<L.density+0.2)eSpots.push({x:x+Math.floor(run/2),row:ROWS-h-1});
      spots.push({x:x+run-2,row:ROWS-h-2});
      x+=run;
    }
  }
  for(;x<cols;x++)ground[x]=h;
  for(let c=0;c<cols;c++)for(let r=ROWS-ground[c];r<ROWS;r++)if(ground[c])map[r][c]='#';
  plats.forEach(p=>{for(let i=0;i<p.len;i++)if(p.x+i<cols)map[p.row][p.x+i]='=';});
  legos.forEach(l=>{if(ground[l.x]&&map[l.row][l.x]==='.')map[l.row][l.x]='x';});
  // pick items evenly
  const cand=spots.filter(s=>s.x>6&&s.x<cols-8).sort((a,b)=>a.x-b.x);
  const items=[],n=Math.min(L.count,cand.length);
  const used=new Set();
  for(let i=0;i<n;i++){let k=Math.round(i*(cand.length-1)/Math.max(1,n-1));while(used.has(k))k++;used.add(k);const s=cand[k];
    const kinds=["dragon","doll","dish","toy","leaf","trash","shirt","ornament","undies","poop","paper","score","paint","robot","weight","towel","oldflower","testtube","book","chewtoy","tire","videogame","pillow"];
    items.push({x:s.x*T,y:s.row*T-1,w:16,h:16,kind:L.item==='mix'?kinds[i%kinds.length]:L.item,got:false,bob:rng()*6});}
  const enemies=[];
  eSpots.filter(s=>s.x>14&&s.x<cols-10).forEach(s=>{
    const type=L.enemies[ri(0,L.enemies.length-1)];
    const e={type,x:s.x*T,y:s.row*T+4,w:14,h:12,vx:-1,vy:0,alive:true,t:rng()*6,dead:0};
    if(type==='bee'||type==='bat'||type==='bubble'||type==='zap'||type==='invader'){e.y=(s.row-2)*T;e.by=e.y;e.vx=-1;}
    enemies.push(e);
  });
  const dh=ground[cols-6];
  const dw=DROP_W[L.drop]||56; // every drop-off is about as wide as the couch
  const drop={x:(cols-6)*T-4-(dw-28),y:(ROWS-dh)*T-24,w:dw,h:24,kind:L.drop};
  return {L,idx,cols,map,ground,items,enemies,movers,drop,theme:THEMES[L.theme],total:items.length};
}

const tileAt=(c,r)=>{if(c<0||c>=lvl.cols)return'#';if(r<0||r>=ROWS)return'.';return lvl.map[r][c];};
const solid=(c,r)=>tileAt(c,r)==='#';
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

function puff(x,y,col,n=8,sp=80){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*sp*2,vy:(Math.random()-.8)*sp*1.5,life:0.6+Math.random()*0.4,col});}

function hurt(fromX){
  if(P.inv>0)return;
  P.inv=1.5;timeLeft=Math.max(0,timeLeft-5);P.vy=-260;P.vx=(P.x<fromX?-1:1)*170;
  SFX.hurt();popText(P.x,P.y-6,"-5 SEC","#ff5252");
  const oops=["OUCH!","YIKES!","BONK!","OOF!","MY TOE!"];say(oops[Math.random()*oops.length|0],1);
}

function updatePlayer(dt){
  // Preserve the wheel contact point when crouching; stand only with headroom.
  const desiredH=keys.duck?8:14,feet=P.y+P.h,newY=feet-desiredH;
  let blocked=false;
  if(desiredH>P.h)for(let r=Math.floor(newY/T);r<=Math.floor((feet-0.01)/T);r++)for(let c=Math.floor(P.x/T);c<=Math.floor((P.x+P.w-0.01)/T);c++)if(solid(c,r))blocked=true;
  if(!blocked){P.h=desiredH;P.y=newY;}
  P.duck=P.h<14;
  const dir=(keys.right?1:0)-(keys.left?1:0);
  if(P.ride){P.x+=P.ride.dx;}
  const max=150,acc=P.on?1400:900;
  if(dir){P.vx+=dir*acc*dt;P.face=dir;}else{const f=(P.on?1600:400)*dt;P.vx=Math.abs(P.vx)<=f?0:P.vx-Math.sign(P.vx)*f;}
  if(Math.abs(P.vx)>max&&P.inv<1.2)P.vx=Math.sign(P.vx)*max;
  P.coyote-=dt;P.buf-=dt;if(jumpPressed)P.buf=0.12;
  if(P.on){P.coyote=0.1;P.jumps=0;}
  else if(P.coyote<=0)P.jumps=Math.max(1,P.jumps);
  P.sq=Math.max(0,(P.sq||0)-dt*5);
  if(P.buf>0&&(P.coyote>0||P.jumps<2)){
    const second=P.coyote<=0;P.jumps=second?2:1;P.vy=-430;P.on=false;P.coyote=0;P.buf=0;P.ride=null;
    SFX.jump();puff(P.x+P.w/2,P.y+P.h,second?"#80deea":"#fff",second?10:4,second?75:40);
  }
  if(!keys.jump&&P.vy<-160)P.vy=-160;
  P.vy=Math.min(P.vy+1300*dt,600);
  // X
  P.x+=P.vx*dt;
  let r0=Math.floor(P.y/T),r1=Math.floor((P.y+P.h-0.01)/T);
  if(P.vx>0){const c=Math.floor((P.x+P.w)/T);for(let r=r0;r<=r1;r++)if(solid(c,r)){P.x=c*T-P.w;P.vx=0;break;}}
  else if(P.vx<0){const c=Math.floor(P.x/T);for(let r=r0;r<=r1;r++)if(solid(c,r)){P.x=(c+1)*T;P.vx=0;break;}}
  // Y
  const prevB=P.y+P.h;if(P.vy>0)P.lastVy=P.vy;P.y+=P.vy*dt;P.on=false;
  const c0=Math.floor(P.x/T),c1=Math.floor((P.x+P.w-0.01)/T);

    const r=Math.floor((P.y+P.h)/T);
    for(let c=c0;c<=c1;c++){const t=tileAt(c,r);if(t==='#'||(t==='='&&prevB<=r*T+0.5)){P.y=r*T-P.h;P.vy=0;P.on=true;P.ride=null;break;}}
    if(!P.on)for(const m of lvl.movers){if(P.x+P.w>m.x&&P.x<m.x+m.w&&prevB<=m.y+1&&P.y+P.h>=m.y){P.y=m.y-P.h;P.vy=0;P.on=true;P.ride=m;break;}}
  }else{
    const r=Math.floor(P.y/T);for(let c=c0;c<=c1;c++)if(solid(c,r)){P.y=(r+1)*T;P.vy=0;break;}
  }
  if(P.on&&!P.wasOn&&P.lastVy>250){P.sq=Math.min(1,P.lastVy/600);puff(P.x+P.w/2,P.y+P.h,'#ffffffaa',6,50);}
  if(P.on&&Math.abs(P.vx)>110&&Math.random()<0.25)parts.push({x:P.x+P.w/2-P.face*4,y:P.y+P.h-2,vx:-P.face*20,vy:-20,life:0.35,col:'#ffffff88'});
  P.wasOn=P.on;P.lastVy=P.vy||P.lastVy;if(P.on){P.lastVy=0;P.jumps=0;}
  if(!P.on)P.ride=null;
  if(P.on&&!P.ride){const cc=Math.floor((P.x+P.w/2)/T);if(lvl.ground[cc]&&lvl.ground[cc-1]&&lvl.ground[cc+1])lastSafe={x:P.x,y:P.y+P.h-14};}
  // hazards (lego)
  const hr0=Math.floor((P.y+4)/T),hr1=Math.floor((P.y+P.h-1)/T);
  for(let r=hr0;r<=hr1;r++)for(let c=c0;c<=c1;c++)if(tileAt(c,r)==='x'){const lx=c*T,ly=r*T+8;if(P.y+P.h>ly&&P.x+P.w>lx+2&&P.x<lx+14)hurt(lx+8);}
  // pit
  if(P.y>H+20){SFX.fall();timeLeft=Math.max(0,timeLeft-5);say("WHOOPS! -5 SEC",1.5);P.x=lastSafe.x;P.h=14;P.duck=false;P.jumps=0;P.y=lastSafe.y-4;P.vx=P.vy=0;P.inv=1.2;}
  P.anim+=Math.abs(P.vx)*dt;
  if(P.inv>0)P.inv-=dt;
}

function updateEnemies(dt){
  for(const e of lvl.enemies){
    if(!e.alive){e.dead-=dt;continue;}
    if(Math.abs(e.x-P.x)>W)continue;
    e.t+=dt;
    const sp={invader:45,chomper:72,ghosty:52,slime:42,weed:38,dust:30,roach:55,roomba:75,cat:50,dog:90,rat:65,duck:40,goose:60,swan:35,squirrel:85,mite:45,bee:40,spider:60,bat:55,bubble:35,zap:65,bzombie:32,bskel:42,bspider:62,hisser:38,tabby:50,husky:72,pom:80,ant:70,hamster:85}[e.type]*(1+levelIdx*0.06);
    if((e.type==='bee'||e.type==='bat'||e.type==='bubble'||e.type==='zap'||e.type==='invader')){e.x+=e.vx*sp*dt;e.y=e.by+Math.sin(e.t*3)*22+(e.type==='zap'?Math.sin(e.t*37)*2:0);if(Math.abs(e.x-e.ox)>60||e.ox===undefined){if(e.ox===undefined)e.ox=e.x;else{e.vx*=-1;e.x+=e.vx*2;}}}
    else{
      if(e.type==='cat'&&Math.sin(e.t*1.3)>0.6){/* cat sits and licks paw */}
      else e.x+=e.vx*sp*dt;
      if((e.type==='squirrel'||e.type==='dog'||e.type==='hamster'||e.type==='husky'||e.type==='pom')&&e.vy===0&&Math.random()<dt*0.8)e.vy=-300;
      e.vy+=1300*dt;e.y+=e.vy*dt;
      const r=Math.floor((e.y+e.h)/T),cA=Math.floor((e.x+2)/T),cB=Math.floor((e.x+e.w-2)/T);
      if(solid(cA,r)||solid(cB,r)){e.y=r*T-e.h;e.vy=0;}
      const front=e.vx>0?Math.floor((e.x+e.w)/T):Math.floor(e.x/T),mr=Math.floor((e.y+e.h/2)/T);
      if(e.vy===0&&(solid(front,mr)||tileAt(front,mr)==='x'||!solid(front,Math.floor((e.y+e.h+2)/T))))e.vx*=-1;
      if(e.y>H+40)e.alive=false;
    }
    if(overlap(P,e)){
      if(P.vy>40&&P.y+P.h-e.y<10){e.alive=false;e.dead=0.5;P.vy=keys.jump?-420:-300;SFX.boing();score+=100;levelScore+=100;puff(e.x+7,e.y+6,"#ccc",10);popText(e.x,e.y-4,"+100","#ffeb3b");}
      else hurt(e.x+e.w/2);
    }
  }
  for(const m of lvl.movers){const ox=m.x;m.x+=m.dir*m.sp*dt;if(m.x>m.b){m.x=m.b;m.dir=-1;}if(m.x<m.a){m.x=m.a;m.dir=1;}m.dx=m.x-ox;}
}

  SFX.boing();popText(s.x,s.y-6,"OOPS!","#fff"); // siblings bounce off hazards with no time penalty
}
function siblingCritters(s,prevB){
  const body=s.d.ace?{x:s.x-6,y:s.y-6,w:22,h:(s.h||20)+6}:{x:s.x,y:s.y,w:10,h:s.h||20}; // ace siblings' zap reaches a little further
  for(const e of lvl.enemies){if(!e.alive||!overlap(body,e))continue;
    if(s.d.ace&&!(s.vy>40&&prevB<=e.y+10)){ // ace siblings zap critters on contact
      e.alive=false;e.dead=0.5;SFX.boing();score+=100;levelScore+=100;puff(e.x+7,e.y+6,"#ff1744",12,120);popText(e.x,e.y-4,"ZAP! +100","#ff8a80");continue;}
    if(s.vy>40&&prevB<=e.y+10){
      e.alive=false;e.dead=0.5;s.vy=-300;s.on=false;s.ride=null;
      SFX.boing();score+=100;levelScore+=100;puff(e.x+7,e.y+6,"#ccc",10);popText(e.x,e.y-4,"+100","#ffeb3b");
    }else hurtSibling(s);

}
// Sibling vehicles share terrain physics: gravity, solid walls, hops and moving platforms.
function moveSibling(s,dt,tx,moving){
  s.inv=Math.max(0,(s.inv||0)-dt);
  s.h=s.h||20;s.jumps=s.jumps||0;
  const w=10,sp=moving?s.d.speed*(s.target?1:0.8):0;

    if(s.ride&&s.on)s.x+=s.ride.dx/steps;
    const dx=tx-s.x,dir=Math.abs(dx)>3?Math.sign(dx):0;
    if(dir&&moving)s.face=dir;

    const feet=s.y+s.h,look=dir&&moving?dir*8:0;
    const blocked=(height,offset)=>{for(let r=Math.max(0,Math.floor((feet-height)/T));r<=Math.floor((feet-0.01)/T);r++)for(let c=Math.floor((s.x+offset)/T);c<=Math.floor((s.x+offset+w-0.01)/T);c++)if(solid(c,r))return true;return false;};
    const lowAhead=look&&!blocked(12,look)&&blocked(20,look);
    const desiredH=lowAhead||blocked(20,0)?12:20;
    s.h=desiredH;s.y=feet-s.h;s.duck=s.h<20;const h=s.h;
    if(s.on)s.jumps=0;else s.jumps=Math.max(1,s.jumps);
    const reach=s.d.ace?12:4,front=Math.floor((s.x+(dir>0?w+reach:-reach))/T),foot=Math.floor((s.y+h+2)/T); // ace siblings look further ahead
    const wall=solid(front,foot-1)||solid(front,foot-2);
    const gap=tileAt(front,foot)==='.'&&tileAt(front,foot+1)==='.';
    const above=s.target&&s.target.y+16<s.y&&Math.abs(dx)<64;
    const critter=lvl.enemies.some(e=>e.alive&&(e.x+e.w/2-(s.x+w/2))*dir>0&&Math.abs(e.x-s.x)<(s.d.ace?70:44)&&Math.abs(e.y-(s.y+h))<24);
    const legoCol=Math.floor((s.x+w/2+dir*(sp*0.14+8))/T);
    const lego=dir&&(tileAt(legoCol,foot-1)==='x'||tileAt(legoCol,foot-2)==='x');
    const first=s.on&&((dir&&(wall||gap||critter||lego))||above);
    const overPit=groundBelow(s.x+w/2,s.y+h)===null;
    const second=!s.on&&s.jumps<2&&s.vy>=-60&&(above||(dir&&overPit));
    if(moving&&!s.duck&&s.inv<=0&&(first||second)){
      s.jumps=first?1:2;s.vy=-430;s.on=false;s.ride=null;
      puff(s.x+w/2,s.y+h,second?"#80deea":"#fff",second?8:4,55);
    }
    const oldX=s.x;s.x+=dir*sp*step;
    const col=Math.floor((s.x+(dir>0?w:0))/T);
    for(let r=Math.max(0,Math.floor(s.y/T));r<=Math.floor((s.y+h-0.01)/T);r++){
      if(dir&&solid(col,r)){s.x=dir>0?col*T-w:(col+1)*T;break;}}
    s.x=Math.max(0,Math.min(lvl.cols*T-w,s.x));s.anim+=Math.abs(s.x-oldX);
    const prevB=s.y+h,floaty=s.d.balloon&&!s.on&&(s.vy||0)>-60; // Annie's balloon: a gentle float at the top of a jump and on the way down
    s.vy=Math.min((s.vy||0)+(floaty?680:1300)*step,floaty?230:600);s.y+=s.vy*step;s.on=false;
    const c0=Math.floor(s.x/T),c1=Math.floor((s.x+w-0.01)/T);
    if(s.vy>=0){
      const r=Math.floor((s.y+h)/T);
      for(let c=c0;c<=c1;c++){const t=tileAt(c,r);if(t==='#'||(t==='='&&prevB<=r*T+0.5)){s.y=r*T-h;s.vy=0;s.on=true;s.ride=null;break;}}
      if(!s.on)for(const m of lvl.movers){if(s.x+w>m.x&&s.x<m.x+m.w&&prevB<=m.y+1&&s.y+h>=m.y){s.y=m.y-h;s.vy=0;s.on=true;s.ride=m;break;}}
    }else{
      const r=Math.floor(s.y/T);for(let c=c0;c<=c1;c++)if(solid(c,r)){s.y=(r+1)*T;s.vy=0;break;}
    }
    if(s.on)s.jumps=0;
    siblingCritters(s,prevB);
    // LEGO bricks hurt either sibling, with the same brief immunity as critter hits.
    for(let r=Math.floor((s.y+4)/T);r<=Math.floor((s.y+h-1)/T);r++)for(let c=c0;c<=c1;c++){
      if(tileAt(c,r)==='x'&&overlap({x:s.x,y:s.y+4,w,h:h-4},{x:c*T+2,y:r*T+8,w:12,h:8}))hurtSibling(s);
    }
    if(!s.on)s.ride=null;
    if(s.y>H+40){
      popText(lastSafe.x,lastSafe.y-12,"BACK!","#fff"); // siblings who fall pop back next to the safe ground, no penalty
      s.x=lastSafe.x;s.h=20;s.duck=false;s.jumps=0;s.y=lastSafe.y-6;s.vy=0;s.on=false;s.ride=null;s.inv=1.2;
      break;
    }
  }
}
// Divide the work, favor nearby reachable items, and retry stalled routes later.
function chooseSiblingTarget(s,dt){
  s.retryIn=Math.max(0,(s.retryIn||0)-dt);
  if(s.target&&!s.target.got){
    const distance=Math.abs(s.target.x-s.x)+Math.abs(s.target.y-s.y);
    if(s.bestDistance===undefined||distance<s.bestDistance-2){s.bestDistance=distance;s.stalled=0;}
    else s.stalled=(s.stalled||0)+dt;
    if(s.stalled<2)return;
    s.skipped=s.target;s.retryIn=4;
  }
  s.target=null;s.bestDistance=undefined;s.stalled=0;
  let best=Infinity;
  for(const it of lvl.items){
    if(it.got||(it===s.skipped&&s.retryIn>0)||sibs.some(o=>o!==s&&o.target===it&&!it.got))continue;
    const risk=lvl.enemies.filter(e=>e.alive&&Math.abs(e.x-it.x)<48&&Math.abs(e.y-it.y)<40).length*40;
    const cost=Math.abs(it.x-s.x)+Math.abs(it.y-s.y)*2+risk;
    if(cost<best){best=cost;s.target=it;}
  }
}
function updateSibs(dt){
  if(P.speechT>0)P.speechT-=dt;
  const played=lvl.L.time-timeLeft; // both siblings pitch in immediately and keep collecting
  SIBS.forEach((d,k)=>{if(played>=d.delay&&!sibs.some(s=>s.k===k)&&P.carry<lvl.total){
    sibs.push({k,d,x:P.x,y:P.y+P.h-20,h:20,duck:false,jumps:0,vy:0,on:false,ride:null,face:1,anim:0,target:null,hop:0});say(d.line,2.5);P.speech=GREETINGS[Math.random()*GREETINGS.length|0];P.speechT=2.2;
    if(AC){const t0=AC.currentTime;if(k){tone(90,0.9,'sawtooth',0.06,600,t0,sfxGain);tone(180,0.9,'square',0.03,1200,t0,sfxGain);} // electric VRRRRM
      else [72,76,79,84].forEach((n,i)=>tone(mtof(n),0.12,'square',0.1,null,t0+i*0.07));}
    for(let i=0;i<14;i++)parts.push({x:P.x,y:P.y-10,vx:(Math.random()-.5)*200,vy:-Math.random()*150,life:1,col:k?"#43a047":"#ec407a"});}});
  const frac=timeLeft/lvl.L.time;
  for(const s of sibs){
    const resting=s.rest>0;if(resting)s.rest=Math.max(0,s.rest-dt); // only pause briefly after taking damage
    // Siblings tag along behind you all level. When time gets low they sprint ahead to grab items:
    // Annie at 33% of the time left, Isaac at 20%. If the clock gets refilled, they fall back in line.
    const rush=frac<=(s.k?0.2:0.33);
    if(rush&&!s.rushing){say(s.k?"ISAAC: TURBO MODE! I GOT THIS!":"ANNIE: TIME'S RUNNING OUT! I'LL GRAB SOME!",2);popText(s.x-10,s.y-12,"GO GO GO!",s.k?"#69f0ae":"#f48fb1");}
    s.rushing=rush;
    let tx,moving;
    const prey=s.d.ace?lvl.enemies.find(e=>e.alive&&Math.abs(e.x-P.x)<280&&Math.abs(e.x-s.x)<320&&Math.abs(e.y-s.y)<90):null;
    if(prey&&!resting){tx=prey.x;moving=true;}                                                         // both siblings hunt nearby bad guys
    else if(rush){chooseSiblingTarget(s,dt);tx=s.target?s.target.x:P.x;moving=!resting;}
    else{s.target=null;tx=P.x-(s.k?62:24)*P.face;moving=!resting&&Math.abs(tx-s.x)>6;if(!moving)s.face=P.face;}
    moveSibling(s,dt,tx,moving);
    if(s.target&&!s.target.got&&Math.abs(s.target.x+8-(s.x+5))<12&&Math.abs(s.target.y+8-(s.y+7))<14){
      const it=s.target;it.got=true;s.rest=0;P.carry++;score+=25;levelScore+=25;SFX.collect();puff(it.x+8,it.y+8,s.k?"#69f0ae":"#f48fb1",8);
      const left=lvl.total-P.carry;popText(it.x-6,it.y-4,left?s.d.name+"! "+left+" LEFT":"ALL DONE!","#fff");if(!left)say("NOW GET TO THE "+lvl.drop.kind.toUpperCase()+"! >>>",2.5);}
  }
}
function updatePlay(dt){
  timeLeft-=dt;updateSibs(dt);
  if(timeLeft<=10&&!honked){honked=true;SFX.honk();say("HONK HONK! THEY'RE CLOSE!",2);}
  updatePlayer(dt);updateEnemies(dt);
  for(const it of lvl.items){if(!it.got&&overlap(P,it)){it.got=true;P.carry++;score+=50;levelScore+=50;SFX.collect();puff(it.x+8,it.y+8,"#ffeb3b",8);
    const left=lvl.total-P.carry;popText(it.x-6,it.y-4,left?left+" LEFT":"ALL DONE!","#fff");if(!left)say("NOW GET TO THE "+lvl.drop.kind.toUpperCase()+"! >>>",2.5);}}
  if(overlap(P,lvl.drop)){
    if(P.carry>=lvl.total){
      const bonus=Math.ceil(timeLeft)*10;score+=bonus;levelScore+=bonus;state='clear';stateT=0;stopMusic();SFX.win();puff(lvl.drop.x+14,lvl.drop.y,"#ffeb3b",30,150);

  cam+=((P.x-W*0.4)-cam)*Math.min(1,dt*8);cam=Math.max(0,Math.min(cam,lvl.cols*T-W));

function updateParts(dt){parts=parts.filter(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.txt)p.vy+=400*dt;return p.life>0;});}

// Player bicycle: mirrored pixel frame, rotating spokes, and alternating pedals.
function drawCyclistRaw(x,y,face,frame,air,duck=false){

  const line=(ax,ay,bx,by,c)=>{const n=Math.max(Math.abs(bx-ax),Math.abs(by-ay),1);
    for(let i=0;i<=n;i++)dot(Math.round(ax+(bx-ax)*i/n),Math.round(ay+(by-ay)*i/n),c);};

      const r=dx*dx+dy*dy;if(r>=16&&r<=25)dot(wx+dx,9+dy,"#263238");

  line(-3,9,2,2,"#00bcd4");line(2,2,6,9,"#00bcd4");line(6,9,-3,9,"#00bcd4");
  line(2,2,11,2,"#80deea");line(11,2,6,9,"#00bcd4");line(10,-1,14,9,"#90a4ae");
  line(0,1,4,1,"#263238");line(10,-1,13,-2,"#263238");line(13,-2,14,0,"#263238");
  // Bent arms reach the bars; knees and shoes follow the crank.

  if(sx===1&&sy===1)outlined(x,y,(ox,oy)=>drawDropRaw(k,ox,oy));

}

  if(P.speechT>0){g.font='8px '+FONT;const tw=Math.ceil(g.measureText(P.speech).width)+8,bx=Math.round(Math.max(cam+3,Math.min(cam+W-tw-3,P.x+P.w/2-tw/2))),byy=Math.round(P.y-24-Math.max(0,P.speechT-2)*20);
    R(bx-1,byy-1,tw+2,16,"#000");R(bx,byy,tw,14,"#fff");{const px=Math.round(P.x+P.w/2);R(px-3,byy+14,6,2,"#fff");R(px-2,byy+16,4,2,"#fff");R(px-1,byy+18,2,1,"#000");}
    text(P.speech,bx+tw/2,byy+3,8,"#e53935","center",false);}

  if(th.dark){g.save();const lx=P.x-cam+5,ly=P.y+6,dg=g.createRadialGradient(lx,ly,70,lx,ly,260);dg.addColorStop(0,'rgba(0,0,10,0)');dg.addColorStop(1,'rgba(0,0,10,0.42)');g.fillStyle=dg;g.fillRect(0,0,W,H);g.restore();}
  g.drawImage(fx,0,0);

}

  R(x+3+(fr?1:0),y+14,3,2,"#ff9800");R(x+7-(fr?1:0),y+14,3,2,"#ff9800");}
function drawPenguin(x,y,sc,fr,blink){g.save();g.translate(Math.round(x),Math.round(y));g.scale(sc,sc);outlined(0,0,(ox,oy)=>penguinRaw(ox,oy,fr,blink),1,1,'#0d1b2a');g.restore();}
function belvoirBadge(x,y,col="#b3e5fc"){drawPenguin(x-26,y-4,1,Math.floor(clock*4)%2,false);text("A BELVOIR STUDIOS GAME",x-10,y,6,col,"left");}
function drawSplash(t){
  R(0,0,W,H,"#0d1b2a");const fade=Math.min(1,t/0.6,Math.max(0,(4-t)/0.6));
  for(let i=0;i<50;i++){const sx=(i*73+Math.sin(t+i)*10)%W,sy=(i*41+t*(20+i%5*8))%H;R(sx,sy,i%3?1:2,i%3?1:2,"#cfe8ff");}
  g.globalAlpha=fade;
  g.fillStyle='#e3f2fd';g.beginPath();g.ellipse(W/2,182,120,14,0,0,7);g.fill();R(W/2-120,182,240,10,"#90caf9");g.fillStyle='#bbdefb';g.beginPath();g.ellipse(W/2,180,110,9,0,0,7);g.fill();
  // three penguins waddle/slide onto the ice
  const land=Math.min(1,t/1.4),wad=Math.floor(t*6)%2,blink=Math.floor(t*10)%25===0;
  drawPenguin(W/2-18+(1-land)*-260,126-Math.abs(Math.sin(t*6))*2*land,3,wad,blink);
  drawPenguin(W/2-70-(1-land)*200,148,2,1-wad,false);
  drawPenguin(W/2+46+(1-land)*220,148,2,wad,blink);
  if(t>1.2){const a=Math.min(1,(t-1.2)/0.5);g.globalAlpha=fade*a;
    text("BELVOIR",W/2,46,24,"#ffffff","center");text("S T U D I O S",W/2,84,10,"#81d4fa","center");R(W/2-90,100,180,2,"#81d4fa");}
  g.globalAlpha=1;g.drawImage(fx,0,0);
}
function drawMenuSiblings(t,y){
  for(let k=0;k<2;k++)drawSibling({k,d:SIBS[k],x:W/2+(k?66:-76),y,face:k?-1:1,anim:t*40,on:true,inv:0},t);
}

  // starry retro bg
  R(0,0,W,H,"#1a1040");
  for(let i=0;i<60;i++){const x=(i*97+t*20*(1+i%3))%W,y=(i*53)%H;R(x,y,2,2,i%5?"#5c4db1":"#fff");}

  drawMenuSiblings(t,148);
  drawItem("toy",W/2-100,160+Math.cos(t*3)*3);drawItem("leaf",W/2+90,160+Math.sin(t*3)*3);
  if(soundGate)text("CLICK OR PRESS ANY KEY FOR SOUND",W/2,200,8,Math.floor(t*2)%2?"#ffeb3b":"#fff","center");
  else if(Math.floor(t*2)%2)text("PRESS ENTER / TAP TO START",W/2,200,8,"#76ff03","center");
  if(!soundGate){const b=SELECT_BTN;R(b.x-1,b.y-1,b.w+2,b.h+2,"#ffeb3b");R(b.x,b.y,b.w,b.h,"#3d2a8a");text("LEVEL SELECT (L)",W/2,b.y+3,6,"#ffeb3b","center",false);}
  text("A/D MOVE  SPACE x2 JUMP  DOWN/S DUCK  M MUTE  P PAUSE",W/2,226,6,"#aaa","center",false);
  text("STOMP CRITTERS. DODGE LEGOS. DON'T FALL.",W/2,240,6,"#aaa","center",false);
  text("MADE BY ISAAC & PETE",W/2,256,6,"#ffeb3b","center");
  g.drawImage(fx,0,0);
}

function drawIntro(t){
  drawPlay(t);panel();
  const L=lvl.L;
  text("LEVEL "+(levelIdx+1),W/2,44,8,"#aaa","center");
  text(L.name,W/2,60,12,"#ffeb3b","center");
  // phone text bubble
  R(70,86,W-140,62,"#e0e0e0");R(70,86,W-140,10,"#43a047");text("NEW TEXT!",78,88,6,"#fff","left",false);
  g.save();wrap(L.text,W/2,100,W-160,8,"#212121");g.restore();
  const cy=wrap("CHORE: "+L.chore,W/2,154,W-120,8,"#fff"),dy=cy-166; // long chores wrap onto a second line inside the panel
  drawItem(L.item==='mix'?'trash':L.item,W/2-62,168+dy,clock);text("x"+lvl.total+"  in "+L.time+" SEC",W/2+8,173+dy,8,"#76ff03","center");
  text("NOW PLAYING: "+(L.music==='mix'?"ALL OF IT AT ONCE!":STYLES[L.music].name),W/2,192+dy,6,"#ff80ab","center");
  if(stateT>0.8&&Math.floor(t*2)%2)text("PRESS ENTER / TAP!",W/2,208+dy,8,"#fff","center");
}
const WIN_LINES=["Mom: Wow. Did a robot do this?","Uncle Pete: I'm suspicious... but proud.","Mom: Is this even our house?!","Uncle Pete: Who are you and what did you do with our kid?"];
const LOSE_LINES=["MOM: WHY IS THERE A SOCK IN THE FRIDGE?!","UNCLE PETE: YOU'RE GROUNDED UNTIL YOU'RE 40!","MOM: NO VIDEO GAMES FOR A MILLION YEARS!","UNCLE PETE: IS THAT... A PANCAKE ON THE CAT?"];
function drawClear(t){
  drawPlay(t);panel();
  text("CHORE COMPLETE!",W/2,48,14,"#76ff03","center");
  wrap(WIN_LINES[levelIdx%WIN_LINES.length],W/2,82,W-110,8,"#fff");
  text("TIME BONUS: "+Math.ceil(timeLeft)+" x 10",W/2,124,8,"#ffeb3b","center");
  text("LEVEL SCORE: "+levelScore,W/2,142,8,"#ffeb3b","center");
  text("TOTAL: "+score,W/2,160,8,"#fff","center");
  drawKid(W/2-5,190-Math.abs(Math.sin(t*6))*12,1,0,true,0);
  drawMenuSiblings(t,184);
  if(stateT>1&&Math.floor(t*2)%2)text(levelIdx<LEVELS.length-1?"ENTER / TAP: NEXT CHORE":"ENTER / TAP: ...",W/2,214,8,"#fff","center");
  if(stateT>1){const b=CLEAR_SEL_BTN;R(b.x-1,b.y-1,b.w+2,b.h+2,"#ffeb3b");R(b.x,b.y,b.w,b.h,"#3d2a8a");text("LEVEL SELECT (L)",W/2,b.y+3,6,"#ffeb3b","center",false);}
}
function drawLose(t){
  drawPlay(t);panel();
  const shake=stateT<1?(Math.random()-.5)*6:0;
  text("PARENTS ARE HOME!",W/2+shake,48,14,"#ff1744","center");
  wrap(LOSE_LINES[(levelIdx+Math.floor(score/50))%LOSE_LINES.length],W/2,82,W-110,8,"#fff");
  // parents silhouettes, angry
  for(let i=0;i<2;i++){const px=W/2-40+i*60;R(px,130,20,40,i?"#5e35b1":"#00897b");R(px+3,116,14,14,"#f5c08a");R(px+5,121,3,2,"#000");R(px+12,121,3,2,"#000");R(px+6,126,8,2,"#b71c1c");R(px+4,119,5,1,"#000");R(px+11,119,5,1,"#000");}
  text("!!",W/2+5,110,12,"#ff1744","center");
  text(P.carry+"/"+lvl.total+" "+ITEM_NAMES[lvl.L.item].toUpperCase()+" DONE",W/2,182,8,"#ffeb3b","center");
  if(stateT>1.2&&Math.floor(t*2)%2)text("ENTER / TAP: TRY AGAIN",W/2,210,8,"#fff","center");
}
function drawEnd(t){
  R(0,0,W,H,"#1a1040");
  for(let i=0;i<40;i++){const x=(i*61+t*60)%W,y=(i*37+t*(30+i))%H;R(x,y,3,3,["#ffeb3b","#e53935","#76ff03","#40c4ff"][i%4]);}
  belvoirBadge(W/2-60,14);
  text("YOU DID IT!!",W/2,40,20,"#ffeb3b","center");
  wrap("Every chore done before the parents got home. They are so confused they are taking you out for pizza AND ice cream.",W/2,80,W-80,8,"#fff");
  text("FINAL SCORE: "+score,W/2,160,10,"#76ff03","center");
  drawKid(W/2-5,190-Math.abs(Math.sin(t*6))*16,Math.sin(t*2)>0?1:-1,t*40,true,0);
  drawMenuSiblings(t,184);
  if(stateT>1.5&&Math.floor(t*2)%2)text("ENTER / TAP: PLAY AGAIN",W/2,226,8,"#fff","center");
  text("MADE BY ISAAC & PETE",W/2,250,8,"#ffeb3b","center");
}

// ================= LEVEL SELECT =================
// Pick any level from the title screen: press L or tap the LEVEL SELECT button. Arrows + Enter, or tap a level.
const SELECT_BTN={x:W/2-62,y:209,w:124,h:13},CLEAR_SEL_BTN={x:W/2-62,y:232,w:124,h:13},SEL_COLS=6,SEL_W=78,SEL_H=46,SEL_X=(W-SEL_COLS*SEL_W)/2+2,SEL_Y=40;
let selIdx=0;
const inBox=(x,y,b)=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
const selRect=i=>({x:SEL_X+(i%SEL_COLS)*SEL_W,y:SEL_Y+Math.floor(i/SEL_COLS)*SEL_H,w:SEL_W-6,h:SEL_H-6});
function openSelect(){state='select';stateT=0;selIdx=Math.min(selIdx,LEVELS.length-1);if(AC)SFX.collect();}
function playFromSelect(i){score=0;startLevel(i);}
function selectKey(code){
  const n=LEVELS.length;
  if(code==='ArrowLeft'||code==='KeyA')selIdx=(selIdx+n-1)%n;
  else if(code==='ArrowRight'||code==='KeyD')selIdx=(selIdx+1)%n;
  else if(code==='ArrowUp'||code==='KeyW')selIdx=Math.max(0,selIdx-SEL_COLS);
  else if(code==='ArrowDown'||code==='KeyS')selIdx=Math.min(n-1,selIdx+SEL_COLS);
  else if(code==='Enter'||code==='Space'){playFromSelect(selIdx);return;}
  else if(code==='Escape'||code==='Backspace'){state='title';stateT=0;return;}
  else return;
  if(AC)tone(660,0.05,'square',0.05);
}
function selectTap(x,y){
  for(let i=0;i<LEVELS.length;i++)if(inBox(x,y,selRect(i))){if(selIdx===i||stateT>0.2)playFromSelect(i);return;}
  if(y>H-24){state='title';stateT=0;}
}
function drawSelect(t){
  R(0,0,W,H,"#1a1040");for(let i=0;i<40;i++){const x=(i*97+t*15)%W,y=(i*53)%H;R(x,y,1,1,"#5c4db1");}
  text("LEVEL SELECT",W/2,12,12,"#ffeb3b","center");
  LEVELS.forEach((L,i)=>{const b=selRect(i),on=i===selIdx;
    R(b.x-1,b.y-1,b.w+2,b.h+2,on?"#ffeb3b":"#000");R(b.x,b.y,b.w,b.h,on?"#3d2a8a":"#261a5c");
    text(String(i+1),b.x+4,b.y+4,8,on?"#ffeb3b":"#fff","left",false);
    drawItem(L.item==='mix'?'trash':L.item,b.x+b.w-20,b.y+3,t,false);
    g.font='6px '+FONT;const words=L.name.split(' ');let line='',yy=b.y+21;
    for(const w of words){const test=line?line+' '+w:w;if(g.measureText(test).width>b.w-6&&line){text(line,b.x+3,yy,6,"#cfd8dc","left",false);line=w;yy+=8;}else line=test;}
    if(line&&yy<b.y+b.h-4)text(line,b.x+3,yy,6,"#cfd8dc","left",false);});
  text("ARROWS + ENTER TO PLAY   ESC OR TAP HERE: BACK",W/2,H-14,6,"#aaa","center",false);
  g.drawImage(fx,0,0);
}

// ================= MAIN LOOP =================
let last=performance.now(),acc=0,clock=0;
function frame(now){
  let dt=Math.min(0.1,(now-last)/1000);last=now;acc+=dt;
  const STEP=1/60;
  while(acc>=STEP){
    acc-=STEP;clock+=STEP;stateT+=STEP;if(msgT>0)msgT-=STEP;
    const pressed=anyPress;anyPress=false;
    if(state==='splash'){if(stateT>4||(pressed&&stateT>0.3)){state='title';stateT=0;}else if(stateT>1.4&&stateT<1.42&&AC)[84,88,91].forEach((n,k)=>tone(mtof(n),0.15,'triangle',0.08,null,AC.currentTime+k*0.08));}
    else if(state==='title'){if(pressed){if(soundGate){soundGate=false;initAudio();}else{score=0;startLevel(0);}}else if(soundGate&&soundReady())soundGate=false;}
    else if(state==='intro'){if(pressed&&stateT>0.5){state='play';jumpPressed=false;startMusic(lvl.L.music);}}
    else if(state==='play'){updatePlay(STEP);updateParts(STEP);}
    else if(state==='clear'){updateParts(STEP);if(pressed&&stateT>1){if(levelIdx<LEVELS.length-1)startLevel(levelIdx+1);else{state='end';stateT=0;startMusic('finale');}}}
    else if(state==='lose'){if(pressed&&stateT>1.2){score=Math.max(0,score-levelScore);startLevel(levelIdx);}}
    else if(state==='end'){if(pressed&&stateT>1.5){state='title';stateT=0;startMusic('french');}}
    jumpPressed=false;
  }
  if(state==='splash')drawSplash(stateT);
  else if(state==='select')drawSelect(clock);
  else if(state==='title'){drawTitle(clock);if(AC&&!music.on)startMusic('french');}
  else if(state==='intro')drawIntro(clock);
  else if(state==='play')drawPlay(clock);
  else if(state==='pause'){drawPlay(clock);panel();text("PAUSED",W/2,110,16,"#ffeb3b","center");text("P TO RESUME",W/2,140,8,"#fff","center");}
  else if(state==='clear')drawClear(clock);
  else if(state==='lose')drawLose(clock);
  else if(state==='end')drawEnd(clock);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
